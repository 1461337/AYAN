<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f1414">
<title>人民的名义 · 高自由度人生模拟器</title>
<style>
:root{
  --red-900:#6f0d0e; --red-800:#8c1313; --red-700:#a51c1c; --red-600:#b8201d;
  --gold:#e8c56a; --gold-2:#f2d98c; --gold-dim:#b9963f;
  --cream:#f6efe0; --paper:#fffdf7; --card:#fdf8ee;
  --ink:#3b3129; --ink-2:#5d5147; --muted:#8d8175;
  --green:#2f7a4f; --blue:#5b8fd0; --blue-bg:#eef4fb;
  --line:#e6dcc8; --shadow:0 2px 10px rgba(90,60,20,.08);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  background:#efe7d7;color:var(--ink);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbbfa5;border-radius:8px}

/* ============ 角色创建 ============ */
.overlay{
  position:fixed;inset:0;z-index:100;overflow:auto;
  background:linear-gradient(170deg,#5e0b0c,#8c1313 45%,#6f0d0e);
  padding:26px 14px calc(30px + var(--safe-b));
}
.setup-wrap{max-width:760px;margin:0 auto}
.setup-title{
  text-align:center;color:#ffe9b8;font-size:26px;font-weight:800;letter-spacing:2px;
  text-shadow:0 2px 8px rgba(0,0,0,.5);margin:8px 0 4px;
}
.setup-sub{text-align:center;color:#e6c98f;font-size:12.5px;letter-spacing:1px;margin-bottom:20px;opacity:.85}
.setup-card{
  background:var(--card);border-radius:14px;padding:18px 16px 20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);border:1px solid #d8c9a6;
}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:5px;letter-spacing:.5px}
.field input,.field select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);font-size:15px;color:var(--ink);font-family:inherit;outline:none;
}
.field input:focus,.field select:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(232,197,106,.25)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.grid-form{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid-form .field-name{grid-column:1/-1}
.grid-form .field-job{grid-column:1/-1}
.field label .sub{font-weight:600;color:#a99b86;font-size:11px;margin-left:6px;letter-spacing:0}
.name-row button{
  padding:0 16px;border-radius:9px;white-space:nowrap;font-weight:700;font-size:13.5px;
  color:#fff6dd;background:linear-gradient(180deg,#b8201d,#8f1414);box-shadow:0 3px 0 #5e0b0c
}
.name-row button:active{transform:translateY(2px);box-shadow:0 1px 0 #5e0b0c}
.hint{font-size:12px;color:var(--muted);margin:-6px 0 12px}
.hint .hl{color:var(--red-700);font-weight:800}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;min-width:0}
.field-err{font-size:12px;color:#a51c1c;font-weight:700;margin-top:5px;min-height:0}
.field-err:not(:empty){margin-top:5px}
.match{background:#f6f1e2;border:1px dashed #d8c48d;border-radius:11px;padding:11px 13px;margin:2px 0 12px}
.match .mt{font-size:12px;font-weight:800;color:#9a7a24;letter-spacing:1px;margin-bottom:7px}
.match .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.match .row span{font-size:12px;padding:3px 9px;border-radius:20px;background:#fffdf7;border:1px solid #e2d6b6;color:#5d5147}
.match .row span b{color:var(--red-700)}
.match .row span.ok{background:#eff8f2;border-color:#bfe0cb;color:#2f7a4f}
.match .row span.no{background:#f6f2ec;border-color:#e6dfd2;color:#9a9088}
.match .bar{height:7px;border-radius:5px;background:#e6ddc8;overflow:hidden;margin:4px 0 6px}
.match .bar i{display:block;height:100%;background:linear-gradient(90deg,#c02623,#8f1414)}
.match .sm{font-size:12px;color:#7a6a4e;line-height:1.6}
.btn-main{
  width:100%;padding:14px;border-radius:11px;font-size:16px;font-weight:800;letter-spacing:2px;
  color:#fff6dd;background:linear-gradient(180deg,#c02623,#8f1414);
  box-shadow:0 6px 0 #5e0b0c,0 8px 18px rgba(0,0,0,.3);
}
.btn-main:active{transform:translateY(2px);box-shadow:0 4px 0 #5e0b0c}
.btn-ghost{
  padding:9px 14px;border-radius:9px;border:1px solid var(--gold-dim);color:#f0d99a;
  background:rgba(255,255,255,.06);font-size:13px;font-weight:700
}

/* ============ 顶栏 ============ */
.hdr{
  background:linear-gradient(160deg,#6f0d0e,#a51c1c 55%,#8c1313);
  color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;
  position:relative;box-shadow:0 3px 14px rgba(80,10,10,.4);
}
.hdr::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 88% 12%,rgba(255,215,140,.22),transparent 42%);pointer-events:none}
.hdr-inner{max-width:1180px;margin:0 auto;position:relative}
.hdr-top{display:flex;align-items:flex-start;gap:10px}
.hdr-title{flex:1;min-width:0}
.rank-name{font-size:19px;font-weight:800;letter-spacing:1px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35);
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rank-name small{font-size:11px;font-weight:600;color:#f7d99a;background:rgba(0,0,0,.22);
  padding:2px 7px;border-radius:20px;letter-spacing:.5px}
.rank-meta{font-size:12.5px;color:#f2d7a5;margin-top:3px;letter-spacing:.3px;line-height:1.5}
.rank-meta b{color:#fff}
.rank-next{
  font-size:12px;color:#ffe0a3;margin-top:5px;letter-spacing:.3px;line-height:1.5;
  background:rgba(0,0,0,.18);border:1px solid rgba(232,197,106,.32);
  border-radius:8px;padding:4px 9px;display:inline-block;max-width:100%
}
.rank-next b{color:#fff;font-weight:800}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22)
}
.avatar{
  width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(180deg,#f5e4b8,#d9bd7e);border:1px solid #fff3d0;
}
.zhiji{font-size:12px;color:#ffe9b8;white-space:nowrap;text-align:right;font-weight:700}
.zhiji b{font-size:16px;display:block;color:#fff;letter-spacing:.5px}
.stats{display:flex;gap:6px;overflow-x:auto;padding:10px 0 9px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;background:rgba(0,0,0,.26);border:1px solid rgba(232,197,106,.5);
  border-radius:8px;padding:4px 9px;font-size:11.5px;color:#ffe6b4;white-space:nowrap;letter-spacing:.5px
}
.chip b{font-size:14.5px;color:#fff;margin-left:4px;font-weight:800}
.chip.warn{border-color:#ffb46b}
.chip.bad{border-color:#ff8a8a}
.gold-line{height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.85}

/* ============ 布局 ============ */
.layout{max-width:1180px;margin:0 auto;padding:14px 12px 12px}
main.view{padding-bottom:12px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden
}
.card-hd{
  padding:14px 14px 12px;border-bottom:1px solid #f0e7d4;
  display:flex;align-items:center;gap:9px;background:linear-gradient(180deg,#fffdf6,#fbf5e7)
}
.card-hd .ic{font-size:19px}
.card-hd h2{margin:0;font-size:16.5px;font-weight:800;color:var(--red-700);letter-spacing:1px}
.card-bd{padding:15px 15px 16px}
.card-bd>.sec-title:first-child{margin-top:0}
.sec-title+.box{margin-top:0}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:4px 11px;border-radius:8px;font-weight:700;letter-spacing:.5px}
.tag.green{color:var(--green);border:1.5px solid #9ecfb0;background:#f0f9f2}
.tag.gold{color:#9a7a24;border:1.5px dashed #dcc27a;background:#fdf8e8}
.tag.red{color:var(--red-700);border:1.5px solid #e2a9a9;background:#fdf1f1}
.tag.gray{color:var(--muted);border:1.5px solid var(--line);background:#f7f3ea}
.sec-title{font-size:15.5px;font-weight:800;color:#1f6b45;letter-spacing:.5px;margin:16px 0 10px;
  padding-left:9px;border-left:3px solid #9ecfb0;line-height:1.35}
.sec-title:first-child{margin-top:0}
.note{
  background:var(--blue-bg);border-left:4px solid #8fb6e0;border-radius:0 10px 10px 0;
  padding:11px 13px;font-size:13.5px;color:#33526f;margin-bottom:13px
}
.note .big{color:var(--red-700);font-weight:800;font-size:15px}
.bars{display:flex;gap:5px;margin:10px 0}
.bars i{flex:1;height:8px;border-radius:5px;background:#d9e2ec;display:block}
.bars i.on{background:linear-gradient(180deg,#8fb6e0,#5b8fd0)}
.txt p{margin:0 0 9px;line-height:1.75}
.txt .hl{color:var(--red-700);font-weight:800}
.txt .gm{color:var(--green);font-weight:800}
.box{background:#fdf6e6;border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.7;
  color:#6c5a3d;margin-bottom:12px;word-break:break-word}
.box b{color:#4a3d28}
.ap-row{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:14px;flex-wrap:wrap}
.dots{display:flex;gap:5px}
.dots i{width:11px;height:11px;border-radius:50%;background:#e0d6c0;display:block}
.dots i.on{background:linear-gradient(180deg,#c02623,#8f1414)}
.btn-red{
  display:block;width:100%;text-align:center;padding:14px;border-radius:11px;
  color:#fff6dd;font-weight:800;letter-spacing:1.5px;font-size:15.5px;
  background:linear-gradient(180deg,#c02623,#8f1414);box-shadow:0 7px 0 #5e0b0c;
  margin-bottom:8px
}
.btn-red:active{transform:translateY(3px);box-shadow:0 4px 0 #5e0b0c}
.btn-red.gray{background:linear-gradient(180deg,#9c9184,#6f665c);box-shadow:0 7px 0 #4e463e}
.btn-red:disabled{opacity:.45;box-shadow:0 4px 0 #5e0b0c;transform:none}
.btn-line{
  display:block;width:100%;text-align:left;padding:12px 13px;border-radius:11px;
  border:1px solid var(--line);background:var(--paper);margin-bottom:9px;font-size:14.5px;
  color:var(--ink);font-weight:600;line-height:1.5;overflow-wrap:anywhere
}
.btn-line small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:3px}
.btn-line:active{background:#f4ecda}
.btn-line:disabled{opacity:.5}
.btn-line .cost{float:right;font-size:12px;color:var(--red-700);font-weight:800}

/* 数据小格 */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kv .k{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.kv .k span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.5px}
.kv .k b{font-size:16px;color:var(--ink);font-weight:800}
.kv .k b.up{color:var(--green)}
.kv .k b.dn{color:var(--red-700)}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.kv2>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  border-bottom:1px dashed #e6dcc8;padding-bottom:5px}
.kv2 span{font-size:12px;color:var(--muted)}
.kv2 b{font-size:14px;font-weight:800;color:var(--ink);text-align:right}
.kv2 b em.mini{font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);
  background:#f2ece0;border-radius:20px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.kv2 b.ok-txt em.mini{background:#e8f5ec;color:#2f7a4f}
.kv2 b.bad-txt em.mini{background:#fbe9e8;color:#a51c1c}
.ind-list{margin:4px 0 8px}
.ind{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px dashed #e8dfcd}
.ind:last-child{border-bottom:none}
.ind-name{flex:0 0 62px;font-size:13px;font-weight:700;color:#7c7266}
.ind-val{flex:1;font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:.3px}
.ind-val em{font-style:normal;font-size:11.5px;font-weight:600;color:#a99b86;letter-spacing:0}
.ind-tag{flex:0 0 auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
  background:#f4efe4;color:#8d8175;white-space:nowrap}
.ind-tag.ok{background:#e8f5ec;color:#2f7a4f}
.ind-tag.bad{background:#fbe9e8;color:#a51c1c}
.ind-tag.top{background:#fdf3e0;color:#9a7a24;box-shadow:inset 0 0 0 1px #e8d5a8}
.bar{height:8px;border-radius:6px;background:#e6ddc8;overflow:hidden;margin:5px 0}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#c02623,#8f1414)}
.bar-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted)}
.bar-row b{color:var(--red-700);font-weight:800;font-size:14px}
.idx{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;
  background:#f0e6cf;color:#8a6b1f;font-size:11.5px;font-weight:800;margin-right:7px;vertical-align:1px}
.bad-txt{color:#a51c1c;font-weight:800}
.ok-txt{color:#2f7a4f;font-weight:800}
.warn-box{background:#fdeceb;border-color:#f0c3c0}
.fr{float:right;margin:0}
.right{margin-left:auto;text-align:right}
.tag-xd{background:rgba(255,215,120,.3);color:#fff5d8}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt14{margin-top:14px}
.mb8{margin-bottom:8px}.mb9{margin-bottom:9px}.mb12{margin-bottom:12px}
.sm{font-size:12.5px}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.over-t{color:#a51c1c}
.npc-main{flex:1;min-width:0}
.npc-score{text-align:center;flex-shrink:0}
.npc-score b{display:block;font-size:17px;color:var(--red-700);font-weight:800;line-height:1.1}
.npc-score span{font-size:10.5px;color:var(--muted);letter-spacing:.5px}
.npc .hint{margin:0;line-height:1.65}
.npc .rel{margin:8px 0}
.npc .npc-act button{line-height:1.3}
.npc .npc-act button small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px}
.npc .box.sm{padding:8px 10px;font-size:12.5px}

/* NPC */
.npc{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:12px;margin-bottom:10px}
.npc-top{display:flex;align-items:center;gap:10px}
.npc-face{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:#f0e6cf;flex-shrink:0}
.npc-name{font-weight:800;font-size:15px}
.npc-name em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:600;margin-left:6px}
.rel{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 8px}
.rel span{font-size:11px;padding:2px 8px;border-radius:20px;background:#f2ece0;color:#6c6155;border:1px solid #e8dfcd}
.rel span.pos{background:#eff8f2;color:#2f7a4f;border-color:#bfe0cb}
.rel span.neg{background:#fdf0f0;color:#a51c1c;border-color:#eec3c3}
.npc-act{display:flex;gap:7px;flex-wrap:wrap}
.npc-act button{
  flex:1;min-width:74px;padding:8px 6px;border-radius:9px;border:1px solid var(--line);
  background:#fbf6ea;font-size:12.5px;font-weight:700;color:#5d5147
}
.npc-act button:active{background:#f0e7d4}

/* 日志 */
.log-item{border-left:3px solid #e2d7c0;padding:0 0 12px 12px;margin-left:4px;position:relative}
.log-item::before{content:"";position:absolute;left:-7px;top:6px;width:11px;height:11px;border-radius:50%;
  background:#fff;border:3px solid var(--gold-dim)}
.log-item .t{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.log-item .h{font-weight:800;font-size:14px;margin:2px 0 3px}
.log-item .d{font-size:13px;color:var(--ink-2);white-space:pre-wrap}
.log-item.good::before{border-color:var(--green)}
.log-item.bad::before{border-color:var(--red-700)}

/* 导航 */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,253,247,.97);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);box-shadow:0 -3px 16px rgba(90,60,20,.1);
  display:grid;grid-template-columns:repeat(3,1fr);
  padding:7px 4px calc(6px + var(--safe-b));
}
.nav button{padding:6px 2px;border-radius:10px;text-align:center;color:#7c7266}
.nav button .ni{font-size:22px;line-height:1.15;display:block}
.nav button .nl{font-size:11.5px;font-weight:700;letter-spacing:.5px}
.nav button.on{color:var(--red-700);background:#fdf1e2}
.nav button.on .nl{color:var(--red-700)}

/* 弹窗 */
.modal{position:fixed;inset:0;z-index:150;overflow:auto}
.modal-mask{
  min-height:100%;background:rgba(40,20,10,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:18px 12px calc(18px + var(--safe-b))
}
.modal-box{
  background:var(--card);border:1px solid #d8c9a6;border-radius:15px;width:100%;max-width:560px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);overflow:hidden;max-height:88vh;overflow-y:auto
}
.modal-box .card-hd{margin:0}
/* 年度总结的紧凑行 */
.sumbox{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #e8dfcd;
  font-size:13.5px;line-height:1.7;color:#4a3d28;word-break:break-word}
.sumbox:last-of-type{border-bottom:none}
.sumbox>span{flex:0 0 62px;font-size:12px;font-weight:800;color:#9a7a24;letter-spacing:.5px;padding-top:2px}
.sumbox.next{background:#eef4fb;border:1px solid #c9dcef;border-radius:9px;padding:9px 11px;margin-top:10px}
.sumbox.next>span{color:#3d6ea8}
/* 提示 */
#toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);
  background:rgba(45,32,25,.94);color:#ffeec9;padding:10px 18px;border-radius:24px
  ;font-size:13.5px;font-weight:700;z-index:200;max-width:90vw;text-align:center;
  opacity:0;pointer-events:none;transition:.28s
}
#toast.show{opacity:1;bottom:calc(108px + var(--safe-b))}

/* 桌面 */
@media (min-width:1024px){
  .ind-list{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
  .ind{border-bottom:1px dashed #e8dfcd}
  .npc-act button{min-width:0}
  body{font-size:15px}
  .layout{display:grid;grid-template-columns:1fr 232px;gap:20px;align-items:start;padding:20px 18px 40px}
  main.view{padding-bottom:0}
  .nav{
    position:sticky;top:18px;left:auto;right:auto;bottom:auto;display:grid;grid-template-columns:1fr;
    gap:4px;border-radius:14px;border:1px solid var(--line);padding:8px;box-shadow:var(--shadow);
    background:var(--card)
  }
  .nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 12px}
  .nav button .ni{font-size:19px;width:24px;text-align:center}
  .nav button .nl{font-size:14px}
  .hdr{padding-left:0;padding-right:0}
  .stats{flex-wrap:wrap;overflow:visible}
  .setup-title{font-size:32px}
  .kv{grid-template-columns:repeat(4,1fr)}
  .grid-form{grid-template-columns:repeat(3,1fr)}
  .grid-form .field-name{grid-column:span 2}

const SHIXI_COUNT = 3;   // 每年从题库中随机抽取 3 项
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2800);
}
function applyEffect(e){
  if(!e) return;
  for(const k of ['能力','道德','健康','人脉','上司','声望']) if(e[k]) S.p[k]=clamp(S.p[k]+e[k],0,100);
  if(e.政绩) S.zhengji = Math.max(0, S.zhengji + Math.round(e.政绩*政绩系数()));
  if(e.cash) S.cash += e.cash;
  if(e.廉政风险) S.discipline.risk = clamp(S.discipline.risk+e.廉政风险,0,100);
  if(e.flag) S.flags[e.flag]=true;
  if(e.rel){
    for(const id in e.rel){
      const r=S.npcs.find(n=>n.id===id); if(!r) continue;
      const d=e.rel[id];
      if(d.信任!=null) r.信任=clamp(r.信任+d.信任,-100,100);
      if(d.利益!=null) r.利益=clamp(r.利益+d.利益,-100,100);
      if(d.公开!=null) r.公开=clamp(r.公开+d.公开,-100,100);
      if(d.好感度!=null) r.好感度=clamp(r.好感度+d.好感度,0,100);
    }
  }
  if(e.mem){ for(const id in e.mem){ const r=S.npcs.find(n=>n.id===id); if(r) r.memory.unshift(e.mem[id]); } }
}
function perfLabel(){ return S && S.p.职业==="公务员" ? "政绩点" : "业绩点"; }
/* 人脉的宽度取决于岗位层级：职位越高，能接触到的人越多；在原地待得再久，圈子也不会无限扩大 */
/* 收过的每一笔都会留在档案里，构成风险的下限——时间冲得淡情绪，冲不淡账目 */
function 案件风险底(){
  const c=(S.discipline&&S.discipline.案件)||[];
  return Math.min(92, c.reduce((a,x)=>a+Math.min(16, Math.round(x.金额/120000*6)+4), 0));
}
function 涉案金额(){
  return ((S.discipline&&S.discipline.案件)||[]).reduce((a,x)=>a+x.金额,0);
}
function 人脉上限(){
  if(!S) return 60;
  return clamp(45+Math.max(0,S.rankIdx+1)*6, 45, 100);
}
/* 快照与差异：用来结算「奖惩」和年度总结 */
function 快照(){
  return {政绩:S.zhengji, 能力:S.p.能力, 道德:S.p.道德, 健康:S.p.健康, 人脉:S.p.人脉,
    上司:S.p.上司, 声望:S.p.声望, 现金:S.cash, 风险:S.discipline.risk, 职级:S.zhijiIdx, 职务:S.rankIdx};
}
function 差异(前,后,简称){
  const 项=[["政绩","政绩"],["能力","能力"],["道德","道德"],["健康","健康"],["人脉","人脉"],["声望","声望"],["领导评价","上司"],["廉政风险","风险"]];
  const out=[];
  项.forEach(([名,键])=>{
    const d=后[键]-前[键];
    if(!d) return;
    if(名==="廉政风险" && d>0){ out.push(`廉政风险 +${d}`); return; }
    out.push(`${简称&&名==="政绩"?perfLabel():名} ${d>0?"+":"-"}${fmt(Math.abs(d))}`);
  });
  const dz=后.现金-前.现金;
  if(dz) out.push(`现金 ${dz>0?"+":"-"}¥${fmt(Math.abs(dz))}`);
  return out.join("　");
}
/* 岗位权重：层级越高，经手事项的分量越大，同样的工作产出更多政绩。
   没有这一项，投入是线性的、门槛是指数增长的，越往上必然卡死。 */
const TIER_WEIGHT = 1.30;
/* 平台产出系数：层级越高，经手事项的影响面越大 */
const 平台系数={"省级":1.15,"市级":1.08,"区级":1.02,"县级":1.0,"乡镇级":0.92};
function 政绩系数(){
  if(!S || S.rankIdx<0) return 1;
  const base=Math.pow(TIER_WEIGHT, S.rankIdx+1);
  const p=平台系数[S.p.平台]||1;
  return S.flags&&S.flags['二线'] ? base*p*0.5 : base*p;   // 二线不再经手一线事务，产出减半
}

function validateName(raw){
  const n=(raw||"").trim();
  if(!n) return "请填写姓名";
  if(/\s/.test(n)) return "姓名不能包含空格";
  if(/[a-zA-Z0-9]/.test(n)) return "姓名不能包含字母或数字";
  if(!/^[\u4e00-\u9fa5]+$/.test(n)) return "姓名只能使用汉字";
  if(n.length<2) return "姓名至少为 2 个汉字";
  if(n.length>4) return "姓名最多为 4 个汉字";
  for(const s of 敏感姓) if(n.includes(s)) return "该姓名涉及敏感人物，请重新填写";
  for(const s of 不当称谓) if(n.includes(s)) return "姓名不得使用职务或不当称谓";
  for(const b of 违禁) if(n.includes(b)) return "该姓名不符合公序良俗，请重新填写";
  const fx=复姓.find(c=>n.startsWith(c));
  if(fx){ if(n.length<fx.length+1) return "复姓之后请至少再写一个字"; }
  else if(!单姓集.has(n[0])) return "姓氏“"+n[0]+"”不常见，请使用常见姓氏";
  return null;
}

const ALL_JOBS=["公务员","事业单位","国企","企业","记者","教师","医生"];

const EDU_BY_AGE = age => age<=20?"高中/中专" : age===21?"大专" : age<=24?"本科" : age<=27?"硕士" : "博士";
const EDU_LEVEL = {"高中/中专":0,"大专":1,"本科":2,"硕士":3,"博士":4};
const eduIdx = e => EDU_LEVEL[e]!=null?EDU_LEVEL[e]:2;
const GRAD_AGE = {"高中/中专":18,"大专":21,"本科":22,"硕士":25,"博士":28};
function xdRate(age, edu){
  const e=eduIdx(edu);
  if(e===2&&age<=25) return 0.16;
  if(e===3&&age<=28) return 0.28;
  if(e===4&&age<=32) return 0.36;
  return 0;
}
function startZhiji(edu, isXd){
  const e=eduIdx(edu);
  let idx=e<=1?0 : e===2?1 : e===3?2 : 3;
  if(isXd) idx=Math.min(职级序列.length-1, idx+1);
  return idx;
}

function makeCandidates(sex, age){

  });
}

function rankTitle(){
  if(S.status==="退休") return "退休（"+((S.positions[0]&&S.positions[0].职级)||"科员")+"）";
  if(S.rankIdx<0) return S.p.职业==="公务员"?"科员":ladder()[0].名;
  const L=ladder();
  return (L[S.rankIdx]&&L[S.rankIdx].名)||"—";
}
function networkScore(){
  const key=S.npcs.filter(n=>!n.非核心);
  if(!key.length) return S.p.人脉;
  let t=0,g=0;
  key.forEach(n=>{ t+=(n.信任+100)/2; g+=n.好感度; });
  return clamp(S.p.人脉*0.45+(t/key.length)*0.30+(g/key.length)*0.25,0,100);
}
/* 人脉门槛：按「领导评价门槛」的 78% 折算，最低 35。
   现实逻辑：人脉讲究的是「广」，领导评价讲究的是「关键一票」，两者不该用同一把尺子。 */
function 人脉门槛(def){ if(!def||!def.门槛) return 35; return Math.max(35, Math.round(def.门槛.上司*0.78)); }

/* 晋升指标共 6 项。
   累计型指标（政绩）用倍数判定：超门槛 20% / 60%。
   比例型指标（能力、道德、领导评价、人脉、健康）满分都是 100，
   用「还剩多少提升空间、已经走完多少」判定，否则健康要 128 分才达标，根本不可能。 */
function indicatorList(def){
  if(!def) return [];
  const mk=(名,当前,门槛)=>{
    if(门槛>=100) return {名,当前,门槛,超20:门槛,超60:门槛,已达20:当前>=门槛,已达60:当前>=门槛};
    const room=100-门槛;
    const 超20=Math.round(门槛+room*0.30);
    const 超60=Math.round(门槛+room*0.70);
    return {名,当前,门槛,超20,超60,已达20:当前>=超20,已达60:当前>=超60};
  };
  const 政绩项={名:"政绩",当前:S.zhengji,门槛:def.门槛.政绩,
    超20:Math.round(def.门槛.政绩*1.2),超60:Math.round(def.门槛.政绩*1.6),
    已达20:S.zhengji>=def.门槛.政绩*1.2,已达60:S.zhengji>=def.门槛.政绩*1.6};
  return [
    政绩项,
    mk("能力",S.p.能力,def.门槛.能力),
    mk("道德",S.p.道德,def.门槛.道德),
    mk("领导评价",S.p.上司,def.门槛.上司),
    mk("人脉",Math.round(networkScore()),人脉门槛(def)),
    mk("健康",S.p.健康,80)
  ];
}
function earlyYears(def){
  if(!def) return 0;
  let c20=0,c60=0;
  indicatorList(def).forEach(x=>{ if(x.已达60) c60++; if(x.已达20) c20++; });
  if(c60>=4) return 4;
  if(c20>=4) return 2;
  return 0;
}
function nextRankInfo(){
  const L=ladder(), idx=S.rankIdx+1, def=L[idx];
  if(!def) return {def:null,min:0,served:S.p2.任职年,can:false,have:false,idx:idx,early:0,effMin:0};
  const early=S.status==="在职"?earlyYears(def):0;
  const effMin=Math.max(1, def.最低年-early);
  const haveZ=S.zhengji>=def.门槛.政绩;
  const healthy=S.p.健康>=50;
  const 未超龄=S.p.年龄<=提任年龄上限(idx);
  return {def:def,min:def.最低年,served:S.p2.任职年,have:haveZ,idx:idx,early:early,effMin:effMin,
    超龄:!未超龄, 年龄线:提任年龄上限(idx),
    can: S.status==="在职" && !S.flags['二线'] && !影响期内() && 未超龄 && S.p2.任职年>=effMin && haveZ && healthy};
}
function retireAge(){
  const senior=S.rankIdx>=6;
  if(S.p.性别==="男") return senior?65:60;
  return senior?63:55;
}

function bind(){
  ['view','modal'].forEach(id=>{
    const root=$(id); if(!root||!root.querySelectorAll) return;
    root.querySelectorAll('[data-act]').forEach(el=>{
      el.onclick=()=>{ const f=ACTIONS[el.dataset.act]; if(f){ f(el.dataset.arg, el); 回到顶部(); } else toast("该操作暂不可用。"); };
    });
  });
}
function render(){
  renderHeader(); renderNav();

  if(S.over){ closeModal(); v.innerHTML=tabEnd(); bind(); return; }

function closeModal(){ $('modal').classList.add('hidden'); $('modal').innerHTML=''; }

        <div class="txt"><p>组织部门找你谈话，拟提任你为 <span class="hl">${pendingPosTitle}</span>。组织上按你的专业、现单位和任职经历，给出了以下岗位方向，<b>只能选择一个</b>。</p>
        <p class="hint">岗位不同，部门关系、群众基础与今后的路也不同。排在前面的，是与你的经历更匹配的岗位。<br>
        组织上不会告诉你哪个岗位更重——同样是"副市长"，市委常委与普通副市长分量并不相同。这一步值不值得走，请自己判断。</p></div>
        ${pendingPositions.map((p,i)=>`<button class="btn-line" data-act="choosePos" data-arg="${i}">
          ${p.名||p}
          <small><b>级别：${p.级别||pendingPosTitle}${p.条线?`　条线：${p.条线}`:""}${p.党政?"　党委序列":""}</b><br>${posHint(p)}</small></button>`).join('')}
        <div class="hint">决定之后不可更改。</div>
      </div>`);
  } else closeModal();
}
function posHint(p){
  const 名=(p&&p.名)||p;
  const 理由=(p&&p.理由)?p.理由.join("、"):"";
  const 补=[];
  // 岗位的轻重不做标注：同样是"副市长"，市委常委与普通副市长分量不同，交由玩家自己判断
  if(p&&p.党政) 补.push("党委序列");
  if(/乡长|镇长|街道办|乡政府|镇政府/.test(名)) 补.push("基层一线，直接面对群众");
  if(/省|部|国家|中央/.test(名)) 补.push("离决策层近，人脉提升快");
  if(/县|区/.test(名)&&!/省|市/.test(名)) 补.push("承上启下，事务最杂");
  return [理由].concat(补).filter(Boolean).join("；");
}
function posEffect(p){
  const 名=(p&&p.名)||p;
  if(/乡长|镇长|街道办|乡政府|镇政府/.test(名)){ applyEffect({道德:2,声望:4,政绩:60,人脉:1,健康:-2});
    return "基层的两年，你走遍了辖区的每个村。群众认得你，也愿意跟你说实话。"; }
  if(/省|部|国家|中央/.test(名)){ applyEffect({上司:3,人脉:3,政绩:30,声望:-1});
    return "你在更高层的机关见了更多场面，也离决策更近了一步。"; }
  if(/县|区/.test(名)){ applyEffect({能力:2,政绩:50,健康:-1});
    return "县区的工作包罗万象，你被迫学会了同时处理十几件事。"; }
  applyEffect({政绩:40,能力:1});
  return "业务条线上的工作扎实而具体，你的专业能力在增长。";
}

      </button>`;
  }
  return card("🧰","施政 · 年度工作安排",
    `<div class="ap-row">本年剩余行动：<b>${S.actions} / ${S.actionsMax} 次</b>
       <span class="dots">${Array.from({length:S.actionsMax},(_,i)=>`<i class="${i<S.actions?'on':''}"></i>`).join('')}</span>
       <span class="hint right">${S.date.y} 年度</span>
     </div>
     <div class="hint mb12">共 ${SHIXI_COUNT} 项年度工作，顺序每年随机；<b>每项每年只能开展一次</b>。答对增加晋升条件；模棱两可不加不减，但连续 3 次以上说明处置能力有问题，此后每次都要扣减，答对一次即清零；答错直接扣减。</div>
     ${rows}
     <div class="box mt12">每年共 ${ACTIONS_PER_YEAR} 次行动额度，由施政、感情与家庭、协调关系、廉政梳理和在职学习共用。</div>
     ${promo}
     <button class="btn-red gray mt12" data-act="endYear">结束本年 · 推进时间 →</button>`);
}
/* 家庭系数：-0.13 ~ +0.04 */
function 家庭系数(){
  let f=0;
  const sp=S.family.配偶;
  if(sp){
    const g=sp.好感度;
    if(g>=80) f+=0.03;
    else if(g>=60) f+=0.015;
    else if(g>=30) f+=0;
    else if(g>=15) f-=0.06;
    else f-=0.13;                        // 夫妻关系濒临破裂，考察组一定会了解到
  }else if(S.family.婚姻==="离异"){
    f-=0.04;                             // 离异本身不致命，但需要向组织说明情况
  }else if(S.p.年龄>=35){
    f-=0.02;                             // 大龄未婚，组织会了解个人情况
  }
  const kids=S.family.子女;
  if(kids.length){
    const avg=kids.reduce((a,c)=>a+c.好感度,0)/kids.length;
    if(avg>=75) f+=0.01;                 // 家风好
    else if(avg<30) f-=0.03;             // 亲子关系紧张，被反映到单位并非不可能
  }
  return f;
}
/* 专业与现岗位条线是否对口：对口的人在同一条线上走得更顺 */
function 专业条线匹配(){
  const 专业=(专业偏好条线[majorGroup(S.p.专业)]||[]);
  const 现条线=条线Of(S.positions[0]&&S.positions[0].岗位);
  return 专业.includes(现条线);
}
function promoteRate(idx){
  const L=ladder(), def=L[idx];
  if(!def) return 0;
  if(S.p.健康<50) return 0;
  if(S.p.年龄>提任年龄上限(idx)) return 0;   // 超过提任年龄界限，不再考虑
  const need=def.门槛;
  let r=0.06;
  r += networkScore()/100*0.30;                                   // 人脉：30%
  r += clamp(S.p.能力-need.能力,0,45)/45*0.17;
  r += clamp(S.p.上司-need.上司,0,45)/45*0.17;
  r += Math.min(1,S.zhengji/Math.max(1,need.政绩))*0.17;
  r += clamp(S.p.道德-need.道德,0,45)/45*0.06;
  if(S.p.健康<70) r -= (70-S.p.健康)*0.006;                        // 健康低于70显著降概率
  else if(S.p.健康<80) r -= (80-S.p.健康)*0.004;
  else if(S.p.健康>=90) r += 0.02;
  if(S.p.选调生) r+=0.06;
  if(idx>=2&&eduIdx(S.p.学历)>=2) r+=0.04;
  if(专业条线匹配()) r+=0.05;                 // 专业与岗位对口
  if(S.flags["党政班子经历"]&&idx>=4) r+=0.04;  // 有党政班子经历，往上走更被认
  if(S.p2.任职年<def.最低年) r-=0.15;
  // 家庭因素：组织考察要看「家风」，家庭稳定是加分项，家庭失和是减分项
  r += 家庭系数();
  r -= S.discipline.risk/100*0.45;
  r -= S.p2.处分*0.07;
  if(!S.p2.初次晋升) r=Math.max(r,0.80+clamp(S.p.专业匹配度-80,0,20)/20*0.10);
  return clamp(r,0.03,0.96);
}
function doPromote(manual){

  if(S.status!=="在职") return toast("已退休，不再涉及晋升。");
  if(S.flags['二线']) return toast("已转任二线岗位，组织上不再考虑实职提拔。");
  if(影响期内()) return toast(`你还在影响期（至 ${S.discipline.影响期} 年底）内，不得提拔或者进一步使用。`);
  if(S.p2.任职年<ni.effMin){
    applyEffect({政绩:-10});
    S.log.unshift({t:`${S.date.y}年`,h:"申请晋升（破格）",kind:"",
      d:`你在任现职 ${S.p2.任职年} 年时主动提出申请。组织部门认为尚不具备条件，未予受理。`});
    toast("申请未被受理：任职年限不足。"); return render();
  }
  if(S.zhengji<ni.def.门槛.政绩){ toast("基本条件尚有缺口，组织暂不列入考虑。"); return; }
  if(S.p.健康<50){ toast("身体条件不适宜承担更重岗位，组织暂不列入考虑。"); return; }
  if(S.p.年龄>提任年龄上限(ni.idx)){
    toast(`已超过提任${ni.def.名}的年龄界限（${提任年龄上限(ni.idx)} 岁），组织上不再考虑。`);
    S.log.unshift({t:`${S.date.y}年`,h:"到龄不再提任",kind:"",
      d:`你已 ${S.p.年龄} 岁，超过提任${ni.def.名}的年龄界限（${提任年龄上限(ni.idx)} 岁）。\n从这一年起，实职提拔这条路对你关闭了。`});
    return render();
  }
  if(S.discipline.risk>=40 && Math.random()<S.discipline.risk/380){
    pendingEvent=生成调查事件("组织正在对你进行晋升考察，同时收到了相关的信访举报");
    pendingEvent.月=rnd(1,12);
    S.log.unshift({t:`${S.date.y}年`,h:"考察中止",kind:"bad",
      d:"晋升考察期间，考察组收到了关于你的反映。考察中止，问题移交有关部门核实。"});
    toast("考察中止：涉及问题线索。");
    return render();
  }
  if(Math.random()>=promoteRate(ni.idx)){
    // 新手保护：第一次晋升考察未通过时不扣政绩、不扣领导评价，只说明差距在哪，
    // 免得新人以为是系统随机，而不是自己没准备好
    if(!S.p2.初次晋升){
      const 缺=[];
      if(S.zhengji<ni.def.门槛.政绩) 缺.push(`${perfLabel()}还差 ${fmt(ni.def.门槛.政绩-S.zhengji)}`);
      if(S.p.能力<ni.def.门槛.能力) 缺.push(`能力还差 ${ni.def.门槛.能力-S.p.能力}`);
      if(S.p.道德<ni.def.门槛.道德) 缺.push(`道德评价还差 ${ni.def.门槛.道德-S.p.道德}`);
      if(S.p.上司<ni.def.门槛.上司) 缺.push(`领导评价还差 ${ni.def.门槛.上司-S.p.上司}`);
      if(S.p.健康<80) 缺.push(`健康需要回到 80 以上（当前 ${S.p.健康}）`);
      if(S.p.人脉<人脉门槛(ni.def)) 缺.push(`人脉还差 ${人脉门槛(ni.def)-S.p.人脉}`);
      S.log.unshift({t:`${S.date.y}年`,h:"首次考察未通过",kind:"",
        d:`组织部门找你谈了话，认为你还需要继续历练。公示名单里没有你。\n`+
          (缺.length?`差距主要在：${缺.join("、")}。`:"组织上认为时机还不成熟。")+
          `\n（这次不影响你的记录，补齐之后可以再次申请。）`});
      toast(缺.length?`考察未通过，差距：${缺[0]}`:"考察未通过，时机未到。");
      return render();
    }
    S.zhengji=Math.max(0,S.zhengji-Math.round(ni.def.门槛.政绩*0.05));
    applyEffect({上司:-1});
    S.log.unshift({t:`${S.date.y}年`,h:"组织考察未通过",kind:"bad",
      d:`组织部门进行了考察谈话，最终认为你还需要继续历练。\n公示名单里没有你。有人安慰你「下一步还有机会」。`});
    toast("组织考察未通过。"); return render();
  }
  pendingPositions=genPositions(ni.idx);
  pendingPosTitle=ni.def.名;
  S.rankIdx=ni.idx;
  // 到了更高的平台，接触的人自然不一样
  const 人脉跃升=3+Math.max(0,S.rankIdx);
  S.p.人脉=clamp(S.p.人脉+人脉跃升,0,100);
  // 提任领导职务后，职级相应调整到该层次的最低线，不会出现「县处级副职 · 三级主任科员」这种组合
  const 职级下限=zhijiFloorOf(S.rankIdx);
  if(S.zhijiIdx<职级下限){
    S.zhijiIdx=职级下限;
    S.income.月工资=Math.max(S.income.月工资, 职务阶梯[S.rankIdx].月薪*0.85);
    S.log.unshift({t:`${S.date.y}年`,h:"职级相应调整",kind:"good",
      d:`因提任领导职务，你的职级同步调整为${职级序列[S.zhijiIdx]}。`});
  }
  S.p2.任职年=0;
  S.p2.连续模糊=0;   // 换岗之后重新开始考察
  S.p2.累计模糊=0;
  if(ni.idx===0) S.p2.初次晋升=true;
  S._晋升消耗=Math.round(ni.def.门槛.政绩*0.75);
  S.zhengji=Math.max(0,S.zhengji-S._晋升消耗);
  S.income.月工资=Math.max(S.income.月工资, ni.def.月薪);
  render();
}
function genPositions(idx){
  const L=ladder(), def=L[idx];
  if(!def) return [];
  let pool=(def.例&&def.例.length)?def.例.slice():[def.名];
  if(S.p.年龄>=二线年龄()){
    pool=["人大常委会副主任","人大专门委员会主任委员","政协副主席","政协秘书长","政府参事"];
  }
  while(pool.length<3) pool.push(def.名+"（"+pick(["综合","业务","行政"])+"）");

  const 专业=(专业偏好条线[majorGroup(S.p.专业)]||[]).slice();
  const 现条线=条线Of(S.positions[0]&&S.positions[0].岗位);
  const 单位条线=条线Of(S.p.单位);
  const 有基层经历=!!S.flags["基层经历"];
  const 有党政经历=!!S.flags["党政班子经历"];
  const 现平台=S.p.平台||"市级";

  const 序号={"乡镇级":0,"县级":1,"区级":1,"市级":2,"省级":3};

  let 突出数=0;
  if(idx>0){ const d=L[idx-1]; if(d){ indicatorList(d).forEach(x=>{ if(x.已达20) 突出数++; }); } }
  const 高配概率 = 突出数>=4 ? 0.75 : 突出数>=2 ? 0.4 : 0.12;

  // 本层级岗位池里若没有本级岗位，上调是唯一出路，不能再罚分
  const 有本级 = pool.some(x=>岗位平台(x)===现平台);

  const 评分=pool.map(名=>{
    let sc=rnd(0,4);
    const 理由=[];
    const 条=条线Of(名);
    const 岗台=岗位平台(名);
    const 基层=/乡长|镇长|街道办|乡政府|镇政府|乡镇党委|街道党工委/.test(名);
    const 高层=/省|部|国家|中央/.test(名);
    const 主官=(条==="主官");
    const 党政=是党政班子(名);
    const 高配=是高配(名);
    const 二线=是二线(名), 实权=是实权(名);
    const d=(序号[岗台]!==undefined&&序号[现平台]!==undefined)?序号[岗台]-序号[现平台]:0;
    // 逐级上升：平台不是想换就换。只有在一个平台上干到顶了，组织才考虑上调；
    // 而且要有基层经历与拿得出手的实绩，否则连门都进不去。
    if(d===0) sc+=6;
    else if(d===1){
      const 够格 = 有基层经历 && 突出数>=2;
      // 每上调一次，再往上调的难度翻倍：省级起点从不上调，乡镇起点要连跳三层
      const 上调概率 = Math.pow(0.45, S.p.上调次数||0);
      // 本级没有合适岗位时也必须过上调这一关，只是门槛略低
      const 过关 = Math.random() < (有本级 ? 上调概率 : Math.max(0.4, 上调概率));
      if(够格 && 过关){
        sc+=6;
        理由.push(有本级?"组织上有意把你放到更高一层的平台锻炼":"本级没有合适岗位，组织安排到上一级平台");
      }else if(过关 && !够格){
        sc-=6; 理由.push("有上调的机会，但缺少基层经历或拿得出手的实绩");
      }else sc-=12;
    }
    else if(d>=2) sc-=16;
    else sc-=4;
    if(条!=="综合" && 条!=="主官" && 条!=="其他" && 专业.includes(条)){ sc+=4; 理由.push("与你的专业对口"); }
    else if(条==="综合" && 专业.includes("综合")){ sc+=2; 理由.push("综合管理岗位，与你所学相近"); }
    if(主官){ sc += 专业.includes("综合")?2:0; 理由.push("主官岗位，综合性强"); }
    if(条===现条线 && 条!=="其他"){ sc+=3; 理由.push("延续你现在的条线"); }
    if(条===单位条线 && 条!=="其他"){ sc+=2; 理由.push("与所在单位业务相通"); }
    if(基层){
      if(有基层经历){ sc+=1; 理由.push("你已有基层经历，回去是压担子"); }
      else { sc+=3; 理由.push("需要到基层历练一段"); }
    }else{
      if(主官||高层){
        if(有基层经历){ sc+=2; 理由.push("基层经验完整，可往上走"); }
        else { sc-=1; 理由.push("缺少基层经历，组织会慎重"); }
      }
    }
    if(idx>=4 && 党政){
      if(有党政经历){ sc+=4; 理由.push("你有党政领导班子经历，组织上会优先考虑"); }
      else { sc-=3; 理由.push("缺少党政领导班子经历，这是硬杠杠"); }
    }
    if(党政 && 有党政经历 && idx<4) sc+=1;
    if(二线){
      if(S.p.年龄>=二线年龄()){ sc+=6; 理由.push("组织上对临近退休干部的统筹安排"); }
      else sc-=6;
    }
    if(实权 && S.p.年龄<二线年龄()) sc+=3;
    if(高配){
      if(S.p.年龄>=二线年龄()) sc-=4;
      else if(Math.random()<高配概率){ sc+=5; 理由.push("经组织统筹考虑后拿出的岗位"); }
      else sc-=6;
    }
    if(S.p.选调生) sc+=1;
    return {名:名,sc:sc,高配:高配,党政:党政,二线:二线,实权:实权,平台:岗台,级别:def.名,条线:条,
      理由:理由.length?Array.from(new Set(理由)):["组织统一安排"]};
  });
  评分.sort((a,b)=>b.sc-a.sc);
  const 可用=(idx>=4)?评分.filter(x=>!(x.党政&&x.高配&&!有党政经历)):评分;
  const 上限=Math.min(8,可用.length);
  const n2=clamp(rnd(3,上限),3,上限);
  return 可用.slice(0,n2);
}
function settlePosition(pos){
  const L=ladder();
  const 职级名=(S.rankIdx>=0&&L[S.rankIdx])?L[S.rankIdx].名:(S.rankIdx<0?"科员":rankTitle());
  if(/乡长|镇长|街道办|乡政府|镇政府|乡镇党委|街道党工委/.test(pos)) S.flags['基层经历']=true;
  if(是党政班子(pos)) S.flags['党政班子经历']=true;
  if(是高配(pos)) S.flags['高配经历']=true;
  const 新台=岗位平台(pos);
  const 台序={"乡镇级":0,"县级":1,"区级":1,"市级":2,"省级":3};
  if(台序[新台]!==undefined && 台序[S.p.平台]!==undefined && 台序[新台]>台序[S.p.平台]){
    const 旧台=S.p.平台;
    S.p.平台=新台;
    S.p.上调次数=(S.p.上调次数||0)+1;
    S.log.unshift({t:`${S.date.y}年`,h:"平台调整",kind:"good",
      d:`你从${旧台}机关调到${新台}机关任职，站到了更高的平台上。`});
  }
  if(是实权(pos)) S.flags['实权经历']=true;
  if(是二线(pos) && !S.flags['二线']){
    S.flags['二线']=true;
    S.p.声望=clamp(S.p.声望+3,0,100);
    S.p.健康=clamp(S.p.健康+4,0,100);
  }
  S.positions.unshift({年:S.date.y,职级:职级名,岗位:pos,条线:条线Of(pos)});
  const extra=posEffect(pos);
  S.log.unshift({t:`${S.date.y}年`,h:"职务调整",kind:"good",
    d:`经组织研究，任命你为${pos}（${职级名}）。${S.p.选调生?"作为选调生，你比同批人快了一步，也比同批人更容易被盯着。":""}\n${extra}`});
  toast("职务调整："+pos);
}

  {名:"独栋/联排别墅",面积:280,总价:7800000,首付比:.50,年:20,奢侈:true}
];
const CARS=[

];
function loanRate(kind){ const pub=["公务员","事业单位","国企"].includes(S.p.职业); return kind==="房"?(pub?3.1:4.2):4.8; }
function monthly(principal, annualPct, years){
  const r=annualPct/100/12, n=Math.round(years*12);
  if(principal<=0||n<=0) return 0;
  if(r===0) return Math.round(principal/n);
  return Math.round(principal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1));
}
function totalMonthly(){ return (S.loans||[]).reduce((a,l)=>a+l.月供,0); }
/* 工资条：应发 = 岗位＋级别＋津补贴；代扣五险一金与个税后为实发 */
function 五险一金(月薪){ const m=(月薪==null?S.income.月工资:月薪); return Math.round(m*0.22); }
function 个税(月薪){
  const m=(月薪==null?S.income.月工资:月薪);
  const y=Math.max(0, m-五险一金(m)-5000);          // 起征点 5000
  if(y<=3000) return Math.round(y*0.03);
  if(y<=12000) return Math.round(90+(y-3000)*0.10);
  if(y<=25000) return Math.round(990+(y-12000)*0.20);
  return Math.round(3590+(y-25000)*0.25);
}
function 实发(月薪){ const m=(月薪==null?S.income.月工资:月薪); return Math.max(0, m-五险一金(m)-个税(m)); }
/* 住房公积金：单位与个人各缴 12%，共 24% 进入个人账户，可提取用于购房与还贷 */
function 公积金月缴(月薪){ const m=(月薪==null?S.income.月工资:月薪); return Math.round(m*0.24); }
/* 年终考核奖：按年度考核结果，约 1—3 个月应发工资 */
function 岗位月薪(idx){ const L=(idx==null||idx<0)?null:职务阶梯[idx]; return L?L.月薪:5200; }
function 年终奖(){
  if(S.status==="退休") return 0;
  const 体制内=["公务员","事业单位","国企"].includes(S.p.职业);
  return Math.round(S.income.月工资*(体制内?rnd(1,3):rnd(0,4)));
}
function netIncome(){
  let n=实发()+S.income.其他;
  const sp=S.family&&S.family.配偶;
  if(sp) n += 实发(sp.退休?(sp.养老金||0):(sp.月收入||0));
  return n;
}
/* 子女月支出：按成长阶段递增，养孩子的钱是越花越多的 */
function 子女月支出(c){
  if(c.独立) return 0;
  const a=c.年龄;
  if(a<=2) return 1500;
  if(a<=5) return 1800;
  if(a<=11) return 1600;
  if(a<=14) return 1900;
  if(a<=17) return 2200;
  if(a<=21) return c.考上大学?3200:1200;
  return 1000;
}
/* 非自住房产的年租金收入（按市值 1.4%） */
function 年租金收入(){
  return (S.assets.房产||[]).filter(x=>!x.自住).reduce((a,x)=>a+Math.round((x.市值||x.购入价||0)*0.014),0);
}
function 年养车成本(){
  return (S.assets.车辆||[]).reduce((a,v)=>a+Math.round((v.总价||v.市值||120000)*0.03),0);
}
function livingCost(){
  let c=Math.round(S.income.月工资*0.28);
  if(S.family.配偶) c+=1400;
  S.family.子女.forEach(k=>c+=子女月支出(k));
  return c;
}
function isPublicJob(){ return ["公务员","事业单位","国企"].includes(S.p.职业); }
function luxuryCount(){
  return (S.assets.房产||[]).filter(x=>/大平层|别墅/.test(x.名||x)).length
       + (S.assets.车辆||[]).filter(x=>/豪华|高端/.test(x.名||x)).length;
}
function buyAsset(kind,i){
  const d=(kind==="房"?HOUSES:CARS)[i];
  const down=Math.round(d.总价*d.首付比);
  const 可用公积金=(kind==="房")?Math.min(S.fund||0, down):0;
  if(S.cash+可用公积金<down) return toast(`首付不足，需 ${fmt(down)} 元${可用公积金?`（公积金可抵 ${fmt(可用公积金)} 元）`:""}。`);
  const pr=d.总价-down, rate=loanRate(kind), pay=monthly(pr,rate,d.年);
  const limit=Math.round((netIncome()+公积金月缴())*0.55);   // 公积金可用于还贷，银行认这一块
  if(pay+totalMonthly()>limit)
    return toast(`银行不予批贷：月供 ${fmt(pay)} 元，已超过家庭月收入 55% 的还款能力上限（${fmt(limit)} 元）。`);
  if(可用公积金>0) S.fund-=可用公积金;
  S.cash-=(down-可用公积金);
  S.loans.push({名:d.名,类型:kind,余额:pr,月供:pay,利率:rate,总月:Math.round(d.年*12),已还:0,年:d.年});
  if(kind==="房"){
    const 首套=S.assets.房产.length===0;
    S.assets.房产.push({名:d.名,面积:d.面积,购入价:d.总价,购入年:S.date.y,市值:d.总价,自住:首套,贷款:true});
    if(首套) S.housing="自有住房 · "+d.名;
  }else{
    S.assets.车辆.push({名:d.名,总价:d.总价,购入年:S.date.y,市值:d.总价});
  }
  S.log.unshift({t:`${S.date.y}年`,h:kind==="房"?"购置住房":"购置车辆",kind:"good",
    d:`你以 ${fmt(down)} 元首付（其中公积金 ${fmt(可用公积金)} 元）买下${d.名}，贷款 ${fmt(pr)} 元，${d.年} 年期，年利率 ${rate}%，月供 ${fmt(pay)} 元。`
      +(kind==="房"?(S.assets.房产.length===1?"\n这是你的第一套房，从租房搬进了自己的家。":"\n这套房用于出租，每年约有 "+fmt(Math.round(d.总价*0.014))+" 元租金收入。"):"")
      +(d.奢侈&&isPublicJob()?`\n一名${S.p.职业}购置这种价位的资产，在每年的组织考察中，都可能被重新提起。`:"")});
  toast("已购置："+d.名); render();
}
function sellAsset(kind,i){
  const arr=kind==="房"?S.assets.房产:S.assets.车辆;
  const it=arr[i]; if(!it) return;
  const 名=it.名||it;
  const loan=S.loans.find(l=>名.indexOf(l.名)===0);
  const 基准=kind==="房"?(it.市值||it.购入价||0):(it.市值||Math.round((it.总价||0)*0.5));
  const price=Math.round(基准*(kind==="房"?(0.94+Math.random()*0.10):(0.90+Math.random()*0.10)));
  const 手续费=Math.round(price*(kind==="房"?0.02:0.005));
  if(loan){ S.cash += price-loan.余额-手续费; S.loans=S.loans.filter(l=>l!==loan); }
  else S.cash += price-手续费;
  arr.splice(i,1);
  if(kind==="房"){
    if(!S.assets.房产.some(x=>x.自住)&&S.assets.房产.length) S.assets.房产[0].自住=true;
    if(!S.assets.房产.length) S.housing="租房（原自有住房已出售）";
  }
  S.log.unshift({t:`${S.date.y}年`,h:kind==="房"?"出售住房":"出售车辆",kind:"",
    d:`你以 ${fmt(price)} 元处置了${名}${loan?`，结清剩余贷款 ${fmt(loan.余额)} 元`:""}，扣除手续费 ${fmt(手续费)} 元。`
      +(kind==="房"&&!S.assets.房产.length?"\n房子卖掉之后，你们又回到了租房的日子。":"")});
  toast("已处置，款项到账。"); render();
}

  const a=S.assets, totalLoan=S.loans.reduce((x,l)=>x+l.余额,0)+S.负债;
  const limit=Math.round(netIncome()*0.55), used=totalMonthly(), pub=isPublicJob(), lux=luxuryCount();

/* ---------- 健康 ---------- */
function healthLevel(){
  const h=S.p.健康;
  if(h>=90) return ["极佳","ok-txt","身体状态很少成为你的负担。"];
  if(h>=80) return ["良好","ok-txt","达到承担更重岗位的身体要求。"];
  if(h>=70) return ["尚可","","还能支撑，但已经能感觉到累。"];
  if(h>=50) return ["偏弱","bad-txt","组织上会开始考虑你的身体是否吃得消。"];
  if(h>=30) return ["较差","bad-txt","再往下走，就是强制退休的线了。"];
  return ["危险","bad-txt","随时可能倒下。"];
}

        已掌握在案涉案金额 ${fmt(涉案金额())} 元。</div>`
      :`<div class="box"><b class="ok-txt">一生未受处分，未发现问题线索。</b><br>在那个位置上待了这么多年，档案里干干净净。</div>`)}
      <div class="sec-title">名誉与社会评价</div>
      <div class="box">
        公开声誉：<b>${rep}</b>　${repText}<br>
        领导评价：<b>${S.p.上司}</b>　道德评价：<b>${S.p.道德}</b><br>
        人脉：<b>${S.p.人脉}</b>　专业能力：<b>${S.p.能力}</b><br>
        处分记录：<b>${S.p2.处分}</b> 次　嘉奖记录：<b>${S.p2.嘉奖}</b> 次<br>
        廉政风险终值：<b>${S.discipline.risk}</b>
      </div>
      <div class="sec-title">人生轨迹</div>
      ${S.log.slice(0,24).map(x=>`<div class="log-item ${x.kind||''}">
        <div class="t">${x.t}</div><div class="h">${x.h}</div><div class="d">${x.d}</div></div>`).join('')}
      <div class="btn-row">
        <button class="btn-ghost" data-act="save">保存存档</button>
        <button class="btn-ghost" data-act="reset">重新开始一生</button>
      </div>
    </div></div>`;
}

function card(icon,title,body){
  return `<div class="card"><div class="card-hd"><span class="ic">${icon}</span><h2>${title}</h2></div>
    <div class="card-bd">${body}</div></div>`;
}

const ACTIONS={
  goto:(t)=>{ curTab=t; render(); window.scrollTo({top:0,behavior:'smooth'}); },

  shixi:(idx)=>{
    idx=+idx;
    const a=SHIXI[idx]; if(!a) return;
    if(S.status!=="在职") return toast("已退休，不再开展施政工作。");
    if(S.actions<=0) return toast("本年行动额度已用完，请结束本年。");
    if(S.usedThisYear.includes(idx)) return toast("本年度该项工作已经开展过了。");
    S.actions--;
    S.usedThisYear.push(idx);
    applyEffect(a.e);
    // 每做一件实事都要消耗身体，全年 5 项合计 5—10 点，正好是一次免费休养能补回来的量
    const 劳损=rnd(1,2);
    S.p.健康=clamp(S.p.健康-劳损,0,100);
    yearLog.unshift({t:`${S.date.y}年`,h:a.名,kind:"",d:a.desc+`（耗费精力，健康 -${劳损}）`});
    const tier=tierOf();
    S.quiz={item:idx, tier:tier, variant:rnd(0,a.asks[tier].length-1), order:shuffle([0,1,2])};
    render();
  },
  answerQuiz:(k)=>{
    if(!S.quiz) return;
    const item=SHIXI[S.quiz.item], set=item.asks[S.quiz.tier][S.quiz.variant];
    const a=set.a[S.quiz.order[+k]];
    if(!a) return;
    const mark=a.判==="正确"?["正确处置","good"]:a.判==="模糊"?["处置平平",""]:["处置失当","bad"];
    const gain=[];
    if(a.判==="模糊"){
      // 模棱两可：不加不减；但「连续」三次说明处置能力有问题，此后每次都要付出代价
      applyEffect({廉政风险:a.e.廉政风险||0});
      S.p2.连续模糊=(S.p2.连续模糊||0)+1;
      S.p2.累计模糊=(S.p2.累计模糊||0)+1;
      if(S.p2.连续模糊>=3){
        const nx=nextRankInfo();
        const base=nx.def?nx.def.门槛.政绩:200;
        const cut={政绩:-Math.max(8,Math.round(base*0.02)),能力:-1};
        applyEffect(cut);
        gain.push(`已连续 ${S.p2.连续模糊} 次模棱两可：${perfLabel()} ${cut.政绩}、能力 ${cut.能力}`);
      }else{
        gain.push(`模棱两可 ${S.p2.连续模糊} / 3 次（不加不减，答对一次即清零）`);
      }
    }else{
      S.p2.连续模糊=0;   // 处置得当或明显失当，都会中断「连续」判定
      applyEffect(a.e);
      if(a.e.政绩) gain.push(`${perfLabel()} ${a.e.政绩>0?"+":""}${a.e.政绩}`);
      if(a.e.能力) gain.push(`能力 ${a.e.能力>0?"+":""}${a.e.能力}`);
      if(a.e.道德) gain.push(`道德 ${a.e.道德>0?"+":""}${a.e.道德}`);
      if(a.e.上司) gain.push(`领导评价 ${a.e.上司>0?"+":""}${a.e.上司}`);
      if(a.e.廉政风险) gain.push(`廉政风险 +${a.e.廉政风险}`);
      if(a.判==="错误"){
        const cut={政绩:-Math.round(a.e.政绩<0?-a.e.政绩*0.6:25),道德:-1};
        applyEffect(cut);
        gain.push(`直接扣除晋升条件：${perfLabel()} ${cut.政绩}、道德 ${cut.道德}`);
      }
    }
    yearLog.unshift({t:`${S.date.y}年`,h:`${item.名} · ${mark[0]}`,kind:mark[1],d:a.fb});
    S.log.unshift({t:`${S.date.y}年`,h:`${item.名}（${mark[0]}）`,kind:mark[1],
      d:a.fb+"\n"+(a.判==="正确"?"这次处置被记入了你的工作实绩，成为晋升考察的加分项。":
        a.判==="模糊"?`没有出错，也没有加分。你已经连续 ${S.p2.连续模糊} 次给出模棱两可的处置。`:
        "这件事留下了需要解释的地方，晋升所需的条件被直接扣减。")});
    toast(`${mark[0]}　${gain.join("　")||"无变化"}`);
    S.quiz=null;
    render();
  },

    const e=EDU_UP[+i]; if(!e) return;
    if(S.edu.在读) return toast("你正在攻读一项学历，无法同时进行。");
    if(!e.需.includes(S.p.学历)) return toast("学历不符，无法报考。");
    const first=Math.round(e.费*0.3);
    if(S.cash<first) return toast(`首期学费不足 ${fmt(first)} 元。`);
    S.cash-=first;
    S.edu.在读={名:e.名,至:e.至,年:e.年,剩:e.年,已付:first,总费:e.费,效:e.效};
    S.log.unshift({t:`${S.date.y}年`,h:"报名在职学历教育",kind:"",
      d:`你报名参加${e.名}，首期缴纳 ${fmt(first)} 元，总费用约 ${fmt(e.费)} 元，周期 ${e.年} 年。\n${e.注}`});
    toast("已报名，开始在职攻读。"); render();
  },
  eduCancel:()=>{
    if(!S.edu.在读) return;
    if(!confirm("中途放弃将损失已缴费用，并留下一次未完成记录。确定？")) return;
    const u=S.edu.在读;
    S.p.声望=clamp(S.p.声望-4,0,100);
    S.log.unshift({t:`${S.date.y}年`,h:"放弃在职学习",kind:"bad",
      d:`你中止了${u.名}，已缴纳的 ${fmt(u.已付)} 元不再退还。单位里有人问起，你只说工作太忙。`});
    S.edu.在读=null; toast("已放弃，学费不退。"); render();
  },
  certStart:(i)=>{
    const c=CERTS[+i]; if(!c) return;
    if(S.edu.证书.includes(c.名)) return toast("你已取得该项资格。");
    if(c.限&&!c.限.includes(S.p.专业)) return toast("专业不符，无法报考。");
    if(S.cash<c.费) return toast(`费用不足 ${fmt(c.费)} 元。`);
    S.cash-=c.费;
    if(c.党校||Math.random()<0.55){
      applyEffect(c.效); S.edu.证书.push(c.名);
      S.log.unshift({t:`${S.date.y}年`,h:`取得${c.名}`,kind:"good",
        d:`经过约 ${c.年} 年的准备，你通过了${c.名}。${c.党校?"培训班结业后，组织部的人记住了你的名字。":"这张证书不会立刻改变什么，但迟早有用。"}`});
      toast("已取得："+c.名);
    }else{
      S.p.声望=clamp(S.p.声望-2,0,100);
      S.log.unshift({t:`${S.date.y}年`,h:`${c.名}未通过`,kind:"bad",
        d:`你花了 ${fmt(c.费)} 元和 ${c.年} 年时间，最终没有通过${c.名}。工作和备考两头都没顾好。`});
      toast("未通过，费用已支出。");
    }
    render();
  },
  audit:()=>{
    if(S.actions<=0) return toast("本年行动额度已用完。");
    S.actions--;
    if(S.discipline.risk<20&&Math.random()<0.7){
      applyEffect({政绩:14,道德:2,声望:2});
      toast("梳理完毕，未发现实质问题，形成了一份报告。");
      S.log.unshift({t:`${S.date.y}年`,h:"廉政自查",kind:"good",d:"你对本人及分管领域做了风险梳理，形成书面报告上报。未发现问题。"});
    }else{
      S.discipline.risk=clamp(S.discipline.risk+rnd(3,9),0,100);
      toast("梳理中发现几处程序瑕疵，你需要时间解释。");
      S.log.unshift({t:`${S.date.y}年`,h:"廉政自查",kind:"bad",d:"梳理中发现几处程序上的模糊地带，其中一处涉及你签过字的材料。你暂时无法完全说清。"});
    }
    render();
  },
  chooseEvent:(i)=>{
    if(!pendingEvent) return;
    const o=pendingEvent.选项[+i]; if(!o) return;
    const 前=快照();
    const res=o.run?o.run():"";
    const 后=快照();
    const 明细=差异(前,后);
    const 好=(后.政绩-前.政绩)+(后.声望-前.声望)+(后.道德-前.道德)+(后.上司-前.上司);
    const 坏=(后.风险-前.风险);
    let 判定 = 坏>=12 ? "后果严重" : (好>=20 ? "处置得当，得到肯定" : 好>0 ? "处理尚可" : "处置失当");
    const 正文 = res + (明细?`\n奖惩结算：${明细}`:"") + `\n（${判定}）`;
    S.log.unshift({t:`${S.date.y}年 ${pendingEvent.月||""}月`,h:pendingEvent.标题,kind:(o.kind||""),d:正文});
    (S._本年事件=S._本年事件||[]).push(`${pendingEvent.月?pendingEvent.月+"月　":""}${pendingEvent.标题}${明细?"　"+明细:""}`);
    pendingEvent=null;
    toast(明细?(判定+"　"+明细):判定);
    render();
  },

  endYear:()=>{
    const 年初=S._年初快照||快照();
    const 本年施政=(S.usedThisYear||[]).length;
    S.date.y++; S.p.年龄++; S.p2.任职年++;
    S.quiz=null;

    // 家庭合并收支 + 年终考核奖 + 非自住房租金 - 养车
    const 奖金=年终奖();
    if(奖金>0){ S.cash+=奖金; yearLog.unshift({t:`${S.date.y}年`,h:"年终考核奖",kind:"good",
      d:`年度考核结果出来，你拿到 ${fmt(奖金)} 元年终奖（约 ${Math.round(奖金/S.income.月工资)} 个月工资）。`}); }
    // 公积金：按月缴存进入个人账户
    S.fund=(S.fund||0)+公积金月缴()*12;
    // 有房贷时，公积金自动冲还贷（现实中每年可提取一次）
    const 房供年=(S.loans||[]).filter(l=>l.类型==="房").reduce((a,l)=>a+l.月供,0)*12;
    if(房供年>0&&S.fund>0){
      const 冲还=Math.min(S.fund, 房供年);
      S.fund-=冲还; S.cash+=冲还;
      yearLog.unshift({t:`${S.date.y}年`,h:"公积金冲还贷",kind:"good",
        d:`从公积金账户提取 ${fmt(冲还)} 元用于偿还房贷。`});
    }
    // 工龄增资：每两年晋一档，约 2%
    if(S.date.y%2===0){
      const 同级=Math.max(6200, (S.rankIdx>=0?岗位月薪(S.rankIdx):5200)*1.6);
      S.income.月工资=Math.min(Math.round(同级), Math.round(S.income.月工资*1.02));
    }
    S.cash += (netIncome()-livingCost())*12;
    const 租金=年租金收入();
    if(租金>0){ S.cash+=租金; yearLog.unshift({t:`${S.date.y}年`,h:"租金收入",kind:"good",
      d:`名下非自住房产本年租金收入约 ${fmt(租金)} 元。`}); }
    const 养车=年养车成本();
    if(养车>0) S.cash-=养车;
    for(const l of S.loans){
      if(l.余额<=0) continue;
      for(let m=0;m<12&&l.余额>0;m++){
        const interest=Math.round(l.余额*l.利率/100/12);
        if(S.cash>=l.月供){ S.cash-=l.月供; l.余额=Math.max(0,l.余额-(l.月供-interest)); l.已还++; }
        else{ l.余额+=l.月供+Math.round(l.月供*0.05); l.已还++;
          S.p.声望=clamp(S.p.声望-3,0,100); S.discipline.risk=clamp(S.discipline.risk+2,0,100);
          yearLog.unshift({t:`${S.date.y}年`,h:"贷款逾期",kind:"bad",
            d:`${l.名}月供 ${fmt(l.月供)} 元未能按时偿还，银行计收罚息并上报征信。`}); }
      }
    }
    S.loans=S.loans.filter(l=>l.余额>0);

    // 在职学历
    if(S.edu.在读){
      const u=S.edu.在读; u.剩--; S.actions=Math.max(0,S.actions-1);
      const per=Math.round((u.总费-u.已付)/Math.max(1,u.剩+1));
      if(per>0){ if(S.cash>=per){ S.cash-=per; u.已付+=per; }
        else yearLog.unshift({t:`${S.date.y}年`,h:"学费未缴",kind:"bad",d:`本年学费 ${fmt(per)} 元未缴清。`}); }
      if(u.剩<=0){
        const old=S.p.学历; S.p.学历=u.至; applyEffect(u.效);
        S.log.unshift({t:`${S.date.y}年`,h:"学历提升完成",kind:"good",
          d:`你完成了${u.名}，学历由${old}提升至${u.至}。`});
        S.edu.在读=null; toast("学历已提升！");
      }
    }

    // 家庭
    if(S.family.配偶){
      const sp=S.family.配偶; sp.年龄++;
      if(!sp.退休){
        if(sp.年龄>=55){ sp.退休=true; sp.养老金=Math.round((sp.月收入||0)*0.8);
          S.log.unshift({t:`${S.date.y}年`,h:`${sp.姓名}退休`,kind:"",d:`${sp.姓名}办理了退休手续，每月养老金约 ${fmt(sp.养老金)} 元。家里的收入少了一块。`}); }
        else sp.月收入=Math.round((sp.月收入||5000)*1.03);
      }
      let drift=rnd(-8,2);
      if(S.flags['本年顾家']) drift+=6;
      sp.好感度=clamp(sp.好感度+drift,0,100);
      if(sp.年龄>=72 && Math.random()<0.03+(sp.年龄-72)*0.012){
        S.family.配偶=null; S.family.婚姻="丧偶";
        S.candidates=makeCandidates(S.p.性别,S.p.年龄); S._候选年数=0;
        S.p.声望=clamp(S.p.声望-3,0,100); S.p.健康=clamp(S.p.健康-8,0,100);
        S.log.unshift({t:`${S.date.y}年`,h:"配偶去世",kind:"bad",
          d:`${sp.姓名}因病去世，享年 ${sp.年龄} 岁。\n家里忽然安静下来，很多习惯要重新学一遍。`});
      }
      else if(sp.好感度<20&&Math.random()<0.35){
        S.family.配偶=null; S.family.婚姻="离异";
        S.candidates=makeCandidates(S.p.性别,S.p.年龄); S._候选年数=0;
        S.p.声望=clamp(S.p.声望-6,0,100); S.p.健康=clamp(S.p.健康-4,0,100);
        S.log.unshift({t:`${S.date.y}年`,h:"离婚",kind:"bad",
          d:`你和${sp.姓名}办理了离婚手续。\n对方说：「你从来没有真正在这个家里待过。」`});
      }
    }
    S.flags['本年顾家']=false;
    S.family.子女.forEach(c=>{
      c.年龄++;
      // 不陪伴会疏远，但亲子之间不会掉到零；成年独立后关系趋于稳定
      const 底=c.独立?30:10;
      c.好感度=clamp(c.好感度-rnd(0,c.独立?1:4),底,100);
      if(c.年龄===3) S.log.unshift({t:`${S.date.y}年`,h:`${c.姓名}上幼儿园`,kind:"",d:`${c.姓名}开始上幼儿园，每月多出一笔不小的开销。`});
      if(c.年龄===6) S.log.unshift({t:`${S.date.y}年`,h:`${c.姓名}上小学`,kind:"",d:`${c.姓名}背上书包上学了。${c.好感度>60?"孩子愿意跟你说学校的事。":"孩子的话越来越少。"}`});
      if(c.年龄===12) S.log.unshift({t:`${S.date.y}年`,h:`${c.姓名}上初中`,kind:"",d:`${c.姓名}升入初中，补课费成了家里的一项固定支出。`});
      if(c.年龄===15) S.log.unshift({t:`${S.date.y}年`,h:`${c.姓名}中考`,kind:"",d:`${c.姓名}今年中考。${c.好感度>60?"孩子愿意听你的意见。":"孩子什么都不愿意跟你说。"}`});
      if(c.年龄===18){
        if(Math.random()<(c.好感度/150+0.25)){
          c.考上大学=true; c.备注="在读大学";
          if(S.family.配偶) S.family.配偶.好感度=clamp(S.family.配偶.好感度+8,0,100);
          S.log.unshift({t:`${S.date.y}年`,h:`${c.姓名}考上大学`,kind:"good",d:`${c.姓名}收到了大学录取通知书。学费和生活费每年要花掉你不少钱，但你请了半天假去车站送他。`});
        }else{
          c.考上大学=false; c.独立=true; c.备注="外出务工";
          S.log.unshift({t:`${S.date.y}年`,h:`${c.姓名}高考失利`,kind:"bad",d:`${c.姓名}没能考上大学，决定外出打工。你在电话里沉默了很久。`});
        }
      }
      if(c.年龄===22&&c.考上大学){
        c.独立=true; c.备注="已工作";
        S.log.unshift({t:`${S.date.y}年`,h:`${c.姓名}大学毕业`,kind:"good",d:`${c.姓名}大学毕业，找到了工作。你终于不用再为他/她的生活费操心。`});
      }
      if(c.独立&&c.年龄>=23&&Math.random()<0.55){
        const 孝养=Math.round(rnd(2000,12000)*(0.4+c.好感度/100));
        S.cash+=孝养;
        yearLog.unshift({t:`${S.date.y}年`,h:`${c.姓名}的孝养`,kind:"good",d:`${c.姓名}给你转了 ${fmt(孝养)} 元，说让你别太省。`});
      }
    });
    // 认识的人也会一年年老去，长期没结果就各自成家（每 8 年更换一批）
    S.candidates.forEach(c=>c.年龄++);
    S._候选年数=(S._候选年数||0)+1;
    if(S.status!=="退休" && S.p.年龄<=66 && (!S.candidates.length || S._候选年数>=8)){
      S.candidates=makeCandidates(S.p.性别,S.p.年龄);
      S._候选年数=0;
    }

    // 先按本年度结束时的身体状况判定（低于20死亡、低于30强制退休）
    lifeCheck();
    if(S.over){ yearWrapUp(); render(); return; }

    // 人脉：在岗位上待得越久，认识的人越多；职级越高，接触的层级越高
    const 上限=人脉上限();
    const 年增=1+Math.floor(Math.max(0,S.rankIdx+1)/3);
    if(S.p.人脉<上限) S.p.人脉=clamp(Math.min(S.p.人脉+年增,上限),0,100);

    // 健康：年度休整带来的恢复；年龄带走一部分，但不会把人一下打垮
    S.p.健康=clamp(S.p.健康+6+Math.min(S.actions,4),0,100);
    if(S.p.年龄>45) S.p.健康=clamp(S.p.健康-2,0,100);
    if(S.p.年龄>55) S.p.健康=clamp(S.p.健康-2,0,100);
    if(S.p.年龄>70) S.p.健康=clamp(S.p.健康-3,0,100);
    if(S.p.健康<25) S.p.能力=clamp(S.p.能力-2,0,100);

    // 事件
    if(S.status==="退休"){
      if(Math.random()<0.55){ pendingEvent=makeRetiredEvent(); pendingEvent.月=rnd(1,12); }
      else if(Math.random()<0.5) retiredMini();
    }else{
      const 廉政机会=(["公务员","事业单位","国企"].includes(S.p.职业) && S.rankIdx>=0 && Math.random()<0.6) ? make腐败事件() : null;
      if(廉政机会){ pendingEvent=廉政机会; pendingEvent.月=rnd(1,12); }
      else if(Math.random()<0.62){ pendingEvent=makeEvent(); pendingEvent.月=rnd(1,12); }
      else if(Math.random()<0.5) miniEvent();
    }

    npcTick(); cityTick(); disciplineTick();
    S.discipline.risk=clamp(S.discipline.risk-6,0,100);

    // 超标资产
    const lux=luxuryCount();
    if(lux>0&&isPublicJob()&&S.status!=="退休"){
      if(Math.random()<0.10+0.08*(lux-1)){
        S.discipline.risk=clamp(S.discipline.risk+10*lux,0,100);
        S.discipline.records.unshift(`${S.date.y}年：组织考察期间，个人有关事项报告中的房产/车辆情况被要求作出说明。`);
        S.p.声望=clamp(S.p.声望-5,0,100);
        if(Math.random()<0.35){ S.p2.处分++; S.p.上司=clamp(S.p.上司-8,0,100); }
        S.log.unshift({t:`${S.date.y}年`,h:"纪律审查",kind:"bad",
          d:`组织部门在考察期间核对个人有关事项报告，你名下 ${lux} 项明显超出收入水平的资产被要求说明来源。\n`
            +(S.p2.处分?"最终给予诫勉谈话，记入个人档案。":"你提供了购房贷款合同与资金来源说明，暂时过关——但这件事被记下来了。")});
      }
    }

    // 挂职期满，回原单位
    if(S.p.挂职 && S.date.y>=S.p.挂职.结束年){
      const g=S.p.挂职;
      S.p.挂职=null;
      S.log.unshift({t:`${S.date.y}年`,h:"挂职期满",kind:"good",
        d:`你在${g.单位}的挂职期满，组织关系转回${S.p.单位}。\n两年基层下来，你说话的分量和两年前不一样了。`});
      toast("挂职期满，回到省委组织部。");
    }

    // 退居二线：到龄后组织上会陆续安排转任人大、政协等岗位
    if(S.p.职业==="公务员"&&S.status==="在职"&&!S.flags['二线']&&S.rankIdx>=2&&S.p.年龄>=二线年龄()){
      const 超龄=S.p.年龄-二线年龄();
      if(S.discipline.risk>=35 && Math.random()<S.discipline.risk/300){
        pendingEvent=生成调查事件("你即将转任二线，组织上按惯例对你进行离任审计");
        pendingEvent.月=rnd(1,12);
      }else if(Math.random()<0.35+超龄*0.12){
        const 现任=S.positions[0];
        const 二线名=pick(["人大常委会副主任","政协副主席","政协秘书长","政府参事"]);
        const 级别名=现任?现任.职级:rankTitle();
        S.positions.unshift({年:S.date.y,职级:级别名,岗位:二线名,条线:"综合"});
        S.flags['二线']=true;
        S.p.声望=clamp(S.p.声望+3,0,100);      // 老同志到二线，通常会得到体面与尊重
        S.p.健康=clamp(S.p.健康+4,0,100);      // 不再一线操劳，身体好转
        S.log.unshift({t:`${S.date.y}年`,h:"转任二线",kind:"",
          d:`年满 ${S.p.年龄} 岁，组织上安排你转任${二线名}（${级别名}）。\n不再分管一线事务，但级别与待遇不变。办公室的人来得少了，会开得也少了。`});
        toast("已转任二线岗位。");
      }
    }

    // 职级并行
    if(S.p.职业==="公务员"&&S.status==="在职"){
      S.p2.职级年=(S.p2.职级年||0)+1;
      if(S.zhijiIdx<zhijiCap()&&S.p2.职级年>=2&&S.p2.处分===0&&S.discipline.risk<70&&Math.random()<0.72){
        S.zhijiIdx++; S.p2.职级年=0; S.income.月工资+=900; S.p.人脉=clamp(S.p.人脉+1,0,人脉上限());
        S.log.unshift({t:`${S.date.y}年`,h:"职级晋升",kind:"good",
          d:`经年度考核，你的职级由${职级序列[S.zhijiIdx-1]}晋升为${职级序列[S.zhijiIdx]}，工资相应调整。`});
      }
    }

    // 自动晋升
    if(S.status==="在职"){
      const ni=nextRankInfo();
      if(ni.can) doPromote(false);
      else if(ni.def&&S.p2.任职年>=ni.effMin&&!promoteGateWhy(ni))
        S.log.unshift({t:`${S.date.y}年`,h:"任职年限已到",kind:"",
          d:`你在现职级已任职 ${S.p2.任职年} 年，达到最低任职年限，但${perfLabel()}等条件尚未达标，组织暂未启动考察。`});
    }

    yearWrapUp();

function promoteGateWhy(ni){
  const d=ni.def; if(!d) return true;
  return S.zhengji>=d.门槛.政绩;
}
function nextYearHint(){
  const ni=nextRankInfo();
  if(S.status==="退休") return "保重身体，照顾好家人。";
  if(!ni.def) return "你已在本序列最高职级。";
  const 缺=[];
  if(S.p2.任职年<ni.effMin) 缺.push(`还差 ${ni.effMin-S.p2.任职年} 年任职年限`);
  if(S.zhengji<ni.def.门槛.政绩) 缺.push(`${perfLabel()}尚缺 ${fmt(ni.def.门槛.政绩-S.zhengji)}`);
  if(S.p.能力<ni.def.门槛.能力) 缺.push("能力还需提升");
  if(S.p.道德<ni.def.门槛.道德) 缺.push("道德评价还需积累");
  if(S.p.上司<ni.def.门槛.上司)缺.push("领导评价还需提升");
  if(S.p.健康<80) 缺.push("健康需回到 80 以上");
  if(缺.length) return `争取 ${ni.def.名}：`+缺.join("，")+"。";
  return `条件已具备，明年有望进入 ${ni.def.名} 的考察程序。`;
}
function yearWrapUp(){
  S.riskSnapshot=S.discipline.risk;
  S.actions=S.actionsMax;
  S.usedThisYear=[];
  S.flags['本年免费健康']=false;
  S.shixiOrder=shuffle(SHIXI.map((_,i)=>i)).slice(0,SHIXI_COUNT);
}
function lifeCheck(){
  if(S.over) return;
  if(S.p.健康<20){ die("长期积劳成疾，身体终于撑不住了"); return; }
  if(S.status!=="退休"&&S.p.健康<30){ retire("健康状况不适宜继续任职"); return; }
  if(S.status!=="退休"&&S.p.年龄>=retireAge()){ retire("到达任职年龄界限"); return; }
  if(S.status==="退休"){
    if(S.p.年龄>=80&&Math.random()<0.12+S.p.年龄*0.006){ die("在家中安详离世"); return; }
    if(S.p.健康<15){ die("久病之后离世"); return; }
  }
}
function retire(why){
  if(S.discipline.risk>=35 && Math.random()<S.discipline.risk/300){
    pendingEvent=生成调查事件("你在办理退休手续前，组织上对你进行离任审计");
    pendingEvent.月=rnd(1,12);
  }
  S.status="退休";
  S.pension=Math.round(S.income.月工资*0.85);
  S.income.月工资=S.pension;
  S.log.unshift({t:`${S.date.y}年`,h:"办理退休",kind:"",
    d:`${why}，你在 ${S.p.年龄} 岁办理了退休手续。\n此后每月领取养老金约 ${fmt(S.pension)} 元。办公室的钥匙交还给了年轻人。`});
  toast("已办理退休。");
}
function die(why){
  S.over=true; S.status="死亡"; S.endYear=S.date.y;
  S.log.unshift({t:`${S.date.y}年`,h:"去世",kind:"bad",
    d:`${S.p.姓名}于 ${S.date.y} 年去世，享年 ${S.p.年龄} 岁。${why}。`});
  toast("人生已到终点。");
}

  pool.push({

    ]

  pool.push({

    背景:"你们处只有一个副处长空缺。",

         else { applyEffect({rel:{colleague:{信任:4}}, 政绩:-5, 声望:-2}); return "半个月后，一份和你方案框架几乎一致的材料上会了，署名只有他一个人。\n你才明白，“请教”是什么意思。"; } }},

       run(){ applyEffect({rel:{colleague:{信任:-2,好感度:4}}, 政绩:4, 能力:1}); return "他拿着框架走了。材料写得比你差一些，但也能用。\n从那以后，他找你的次数少了。"; }},
      {text:"直接说明这份材料你也在报，建议合作", hint:"把话摆到桌面上",

  // 按身份补充
  if(S.p.职业==="记者") pool.push({

      {text:"直接发稿，抢热度", hint:"快，但可能伤及无辜",
       run(){ const r=Math.random();

         else { applyEffect({声望:-14, 政绩:-8, 道德:-6}); return "稿子里的一个关键数字是错的。被点名的企业公开了完整台账。\n你被迫更正并道歉，媒体圈记住了这次失误。"; } }},
      {text:"把线索转给纪委，自己不发", hint:"放弃独家，换真实结果",
       run(){ applyEffect({道德:6, 声望:4, 政绩:8, rel:{"discipline":{信任:12,公开:6}}}); return "你把材料整理成一份情况反映交给了市纪委。\n三个月后，那个园区的补贴分配办法被修订。没有任何人提到你的名字。"; }}
    ]
  });

  if(S.p.职业==="企业"||S.p.职业==="国企") pool.push({
    类型:"中型事件", 标题:"一笔到期的贷款",

      {text:"找关系搭桥，请政府协调", hint:"可能有效，也欠下人情",

      {text:"民间借贷过桥，赌一把回款", hint:"快，风险极高",

    ]
  });
  return pick(pool);
}
/* ===== 纪律审查：处理档次按「涉案金额 + 风险 + 案件数」综合判定 ===== */
function 影响期内(){
  return !!(S.discipline && S.discipline.影响期 && S.date.y < S.discipline.影响期);
}
function 生成调查事件(触发点){
  return {
    类型:"纪律审查",
    标题:"纪委监委找你谈话",
    描述:触发点+"。市纪委监委的工作人员请你到谈话室，谈话从上午九点持续到下午三点，问的都是这些年的事——哪一年、哪一笔、谁经的手。",
    背景:"桌上放着一本台账。你看不清上面写了什么，但你知道那里面有你。",
    选项:[
      {text:"主动交代全部问题，包括组织还没有掌握的",hint:"争取从轻处理",
       run(){
         const r=处置结果(-1);
         S.discipline.records.unshift(`${S.date.y}年：主动向组织交代问题，获得从轻处理。`);
         return "你把能想起来的每一笔都写了下去，一共写了十七页。\n交代完的那一刻，你反而觉得轻松了。\n\n"+r; }},
      {text:"只说明组织已经掌握的部分",hint:"不说谎，但也不全说",
       run(){
         const r=处置结果(0);
         return "你只承认了台账上有的那几笔，其余的一概说记不清。\n办案人员没有追问，只是把记录推过来让你签字。\n\n"+r; }},
      {text:"避重就轻，并设法与相关人员统一口径",hint:"对抗组织审查，性质就变了",
       run(){
         applyEffect({道德:-6,声望:-8});
         S.discipline.records.unshift(`${S.date.y}年：对抗组织审查，与他人串供。`);
         const r=处置结果(1);
         return "你当晚给人打了两个电话。办案人员后来调取了通话记录——这一步，让你的问题从违纪变成了对抗组织审查。\n\n"+r; }}
    ]
  };
}
function 处置结果(从轻){
  const risk=S.discipline.risk;
  const 金额=涉案金额();
  const 案数=(S.discipline.案件||[]).length;
  let 严重=金额/10000 + risk*0.6 + 案数*4 + 从轻*60;
  严重=Math.max(0, 严重*(0.85+Math.random()*0.3));
  const 档 = 严重<25?0 : 严重<60?1 : 严重<130?2 : 严重<280?3 : 4;
  let 文本="";
  if(档===0){
    applyEffect({声望:-3,廉政风险:-12});
    S.discipline.records.unshift(`${S.date.y}年：接受谈话提醒。`);
    文本="经研究，决定对你进行谈话提醒。\n谈话结束后，你自己走回了办公室。这一次，组织给了你一个机会。";
  }else if(档===1){
    S.discipline.影响期=S.date.y+1;
    applyEffect({声望:-7,上司:-5,廉政风险:-14,道德:-2});
    S.discipline.records.unshift(`${S.date.y}年：受到诫勉谈话处理，影响期一年。`);
    文本="经研究，决定给予你诫勉谈话处理，影响期一年。\n影响期内不得提拔或者进一步使用。你的名字从当年的考察名单上被划掉了。";
  }else if(档===2){
    S.p2.处分++;
    S.discipline.已查金额=(S.discipline.已查金额||0)+金额;
    S.discipline.案件=[];                 // 问题已被查处，旧案了结
    S.discipline.risk=Math.min(S.discipline.risk, 18);
    S.discipline.影响期=S.date.y+2;
    applyEffect({声望:-14,上司:-12,廉政风险:-20,道德:-3});
    const 处=pick(["党内警告","党内严重警告","记过","记大过"]);
    S.discipline.records.unshift(`${S.date.y}年：受到${处}处分。`);
    文本=`经市纪委常委会会议研究并报市委批准，决定给予你${处}处分。\n处分决定在单位全体干部大会上宣读。你坐在第一排，从头到尾没有抬头。`;
  }else if(档===3){
    S.p2.处分++;
    S.discipline.已查金额=(S.discipline.已查金额||0)+金额;
    S.discipline.案件=[];                 // 立案查处后旧案了结
    S.discipline.risk=Math.min(S.discipline.risk, 12);
    S.rankIdx=Math.max(-1, S.rankIdx-2);
    S.p2.任职年=0;
    const 处=pick(["撤销党内职务","开除党籍、政务撤职"]);
    S.discipline.records.unshift(`${S.date.y}年：被立案审查调查，给予${处}处分，免去现职。`);
    applyEffect({声望:-30,上司:-25,健康:-10,道德:-4});
    文本=`经省纪委监委立案审查调查，决定给予你${处}处分，并免去现任职务。\n通报在省里发了通稿——严重违纪违法。你从办公室搬走的时候，只带走了两个纸箱。`;
  }else{
    S.p2.处分++;
    S.discipline.移送=true;
    S.over=true; S.status="死亡"; S.endYear=S.date.y;
    applyEffect({声望:-45,上司:-30,健康:-20});
    S.discipline.records.unshift(`${S.date.y}年：严重违纪违法，被开除党籍、开除公职，涉嫌犯罪问题移送检察机关依法审查起诉。`);
    文本="经省纪委监委立案审查调查，查明你利用职务便利为他人谋取利益，非法收受财物数额特别巨大。\n决定给予你开除党籍、开除公职处分，涉嫌犯罪问题移送检察机关依法审查起诉。\n\n你被带走的那天，办公室的灯还亮着。";
  }
  S.log.unshift({t:`${S.date.y}年`,h:"纪律审查",kind:"bad",d:文本});
  return 文本;
}

function cityTick(){
  for(const k in S.city) if(Math.random()<0.5) S.city[k]=clamp(S.city[k]+rnd(-4,4),10,95);
  S.market=S.market||{房价:1};
  const drift=((S.city.房地产-50)/100)*0.03 + rnd(-18,22)/1000;
  S.market.房价=Math.max(0.45, S.market.房价*(1+drift));
  (S.assets.房产||[]).forEach(x=>{ if(x.购入价) x.市值=Math.round(x.购入价*S.market.房价); });
  (S.assets.车辆||[]).forEach(v=>{
    const 车龄=Math.max(0, S.date.y-(v.购入年||S.date.y));
    // 每年折旧约 15%；超过 15 年的车只剩报废残值
    v.市值=Math.round((v.总价||0)*(车龄>=15?0.05:Math.pow(0.85,车龄)));
  });
}

      S.log.unshift({t:`${S.date.y}年`,h:"被反映",kind:"bad",d:"纪委收到一条与你有关的信访反映，暂未找你谈话。你从别人口里听到了这件事。"});
    }else{
      S.discipline.records.unshift(`${S.date.y}年：接受谈话提醒一次。`);
      S.discipline.risk=clamp(r-10,0,100); S.p.上司=clamp(S.p.上司-3,0,100);
      S.log.unshift({t:`${S.date.y}年`,h:"谈话提醒",kind:"bad",d:"一位老领导把你叫到办公室，说了半小时，没提具体的事。你听懂了一半。"});
    }
  }
}

/* =========================================================
   旧存档兼容
========================================================= */
function upgradeSave(s){
  s.loans=s.loans||[]; s.edu=s.edu||{在读:null,证书:[]};
  s.assets=s.assets||{房产:[],车辆:[],投资:[]}; s.market=s.market||{房价:1};
  const 房价表={"城郊刚需小两居":680000,"市区普通两居":1350000,"学区三居":2600000,"改善型大平层":4200000,"独栋/联排别墅":7800000};
  const 车价表={"经济型代步车":120000,"合资中级车":220000,"豪华品牌轿车":450000,"高端SUV":800000};
  s.assets.房产=(s.assets.房产||[]).map((x,i)=>{
    if(typeof x!=="string") return x;
    const 命=Object.keys(房价表).find(k=>x.indexOf(k)>=0);
    const 价=命?房价表[命]:1200000;
    return {名:x.replace(/（[^）]*贷款[^）]*）/g,"").replace(/（超标）/g,""),面积:命?({"城郊刚需小两居":70,"市区普通两居":90,"学区三居":120,"改善型大平层":160,"独栋/联排别墅":280})[命]:90,
      购入价:价,购入年:(s.date?s.date.y:2040)-5,市值:价,自住:i===0,贷款:/贷款/.test(x)};
  });
  s.assets.车辆=(s.assets.车辆||[]).map(x=>{
    if(typeof x!=="string") return x;
    const 命=Object.keys(车价表).find(k=>x.indexOf(k)>=0);
    const 价=命?车价表[命]:150000;
    return {名:x.replace(/（超标）/g,""),总价:价,购入年:(s.date?s.date.y:2040)-2,市值:Math.round(价*0.7)};
  });
  if(s.family&&s.family.配偶){
    if(s.family.配偶.月收入==null) s.family.配偶.月收入=5200;
    if(s.family.配偶.养老金==null) s.family.配偶.养老金=0;
    if(s.family.配偶.退休==null) s.family.配偶.退休=false;
  }
  ((s.family&&s.family.子女)||[]).forEach(c=>{ if(c.考上大学==null) c.考上大学=/大学/.test(c.备注||""); if(c.独立==null) c.独立=(c.年龄||0)>=22; });
  s.positions=s.positions||[]; s.负债=s.负债||0;
  s.actionsMax=ACTIONS_PER_YEAR;
  if(s.date&&s.date.m!==undefined) s.date={y:s.date.y||2040};
  s.p2=s.p2||{};
  if(s.p2.任职年==null) s.p2.任职年=s.p2.任职月?Math.floor(s.p2.任职月/12):0;
  if(s.p2.职级年==null) s.p2.职级年=0;
  if(s.p2.处分==null) s.p2.处分=0;
  if(s.p2.嘉奖==null) s.p2.嘉奖=0;
  if(s.p2.初次晋升==null) s.p2.初次晋升=false;
  if(s.p2.连续模糊==null) s.p2.连续模糊=s.p2.模糊次数||0;
  if(s.p2.累计模糊==null) s.p2.累计模糊=s.p2.模糊次数||0;
  s.riskSnapshot=s.riskSnapshot||0;
  s.quiz=null;
  if(s.yearSummary===undefined) s.yearSummary=null;
  if(s._年初快照===undefined) s._年初快照=null;
  if(s._晋升消耗===undefined) s._晋升消耗=0;
  if(s.fund==null) s.fund=0;
  if(!s.p.平台) s.p.平台='市级';
  if(s.p.挂职===undefined) s.p.挂职=null;
  if(s.p.上调次数===undefined) s.p.上调次数=0;
  if(s.yearSummary){
    if(!s.yearSummary.施政评价) s.yearSummary.施政评价={正确:0,模糊:0,失当:0};
    if(!Array.isArray(s.yearSummary.事件)) s.yearSummary.事件=[];
    if(!Array.isArray(s.yearSummary.记录)) s.yearSummary.记录=[];
  }
  if(!Array.isArray(s._本年事件)) s._本年事件=[];
  if(s.p&&s.p.人脉==null) s.p.人脉=28;
  if(!Array.isArray(s.shixiOrder)||s.shixiOrder.length!==SHIXI_COUNT||s.shixiOrder.some(i=>i>=SHIXI.length))
    s.shixiOrder=shuffle(SHIXI.map((_,i)=>i)).slice(0,SHIXI_COUNT);
  if(!Array.isArray(s.usedThisYear)) s.usedThisYear=[];
  if(!s.family) s.family={婚姻:"单身",配偶:null,子女:[]};
  if(!s.candidates||!s.candidates.length) s.candidates=makeCandidates(s.p.性别||"男", s.p.年龄||26);
  s.status=s.status||"在职";
  if(s.beginYear==null) s.beginYear=2040;
  if(s.p.学历===undefined){ s.p.学历=EDU_BY_AGE(s.p.年龄||30); s.p.选调生=false; s.p.政治面貌="群众"; s.p.专业匹配度=fitOf(s.p.专业||"法学",s.p.职业||"公务员"); }
  if(s.p.健康==null) s.p.健康=70;
  if(!s.housing) s.housing="与人合租的老小区两居";
  s.npcs.forEach(n=>{ if(n.好感度==null) n.好感度=clamp(100-(n.距离||40),0,100); delete n.距离; if(n.信任==null) n.信任=0; });
  return s;
}

/* =========================================================
   角色创建页
========================================================= */
(function initSetup(){
  const sel=$('f-major');
  sel.innerHTML=Object.entries(MAJORS).map(([g,list])=>
    `<optgroup label="${g}">${list.map(m=>`<option>${m}</option>`).join('')}</optgroup>`).join('');
})();
function refreshMatch(){
  const age=clamp(parseInt($('f-age').value||'24',10)||24,18,38);
  const edu=EDU_BY_AGE(age);
  const major=$('f-major').value;
  const jobSel=$('f-job'), prev=jobSel.value;
  const ok=ALL_JOBS.map(j=>({j,f:fitOf(major,j)})).filter(x=>x.f>80);
  jobSel.innerHTML=ok.map(x=>`<option value="${x.j}">${x.j}（匹配度 ${x.f}%）</option>`).join('');
  if(ok.some(x=>x.j===prev)) jobSel.value=prev;
  const job=jobSel.value, fit=fitOf(major,job);
  $('match-box').innerHTML =
   `<div class="mt">系 统 匹 配 结 果</div>
    <div class="row">
      <span>匹配学历 <b>${edu}</b></span>
      <span>专业—职业匹配度 <b>${fit}%</b></span>
      <span class="ok">应届 · 无工作经历</span>
    </div>
    <div class="sm">
      专业与职业匹配度须高于 80% 方可选择该职业；匹配度越高，入职后的路也越顺。${fit>=90?"你的专业与这一职业高度对口。":""}<br>
      学历由年龄按国民教育序列自动匹配，出生地、所在地与家庭背景由系统随机匹配；<br>
      进入体制后（公务员 / 事业单位 / 国企）可在「🎓 进修」页在职、在编、在岗提升学历。
    </div>`;
}
['f-age','f-major','f-job'].forEach(id=>{
  const el=$(id); if(el){ el.addEventListener('input',refreshMatch); el.addEventListener('change',refreshMatch); }
});
$('btn-rand').onclick=()=>{ $('f-name').value=randomName($('f-sex').value); $('f-name-err').textContent=""; };
$('f-sex').addEventListener('change',()=>{ if($('f-name-err').textContent) $('f-name-err').textContent=""; });
refreshMatch();

/* =========================================================
   启动
========================================================= */
$('btn-start').onclick=()=>{
  const name=$('f-name').value.trim();
  const err=validateName(name);
  if(err){ $('f-name-err').textContent=err; $('f-name').focus(); return; }
  $('f-name-err').textContent="";
  const age=clamp(parseInt($('f-age').value||'24',10)||24,18,38);
  S=newState({name:name,sex:$('f-sex').value,age:age,major:$('f-major').value,
    job:$('f-job').value,edu:EDU_BY_AGE(age)});
  S.beginYear=S.date.y;
  S._年初快照=快照();
  $('setup').classList.add('hidden');
  $('app').classList.remove('hidden');
  curTab='事件'; render();
  if(pendingPositions){ /* 不会发生 */ }
  setTimeout(()=>toast("人生开始。你的选择会留下痕迹。"),400);
};
$('btn-help').onclick=()=>ACTIONS.help();
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&pendingEvent) toast("这件事需要你作出决定。"); });
</script>
