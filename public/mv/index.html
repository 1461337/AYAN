function drawSpaceScene(t){

  if(b.pulse>.6){ctx.save();ctx.globalAlpha=(b.pulse-.6)*.11;ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.restore()}

function drawPlaceholder(t,name){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#6ac8f0");g.addColorStop(1,"#2a6a9a");ctx.fillStyle=g;ctx.fillRect(-80,-80,W+160,H+160);
  ctx.fillStyle="#fff";ctx.font='700 80px "Microsoft YaHei"';ctx.textAlign="center";ctx.fillText(name,W/2,H/2);

function drawLyrics(t){
  let idx=-1;
  for(let i=0;i<LYRICS.length;i++){const l=LYRICS[i];if(t>=l.times[0]-.06&&t<=l.end+.22)idx=i}
  if(idx<0)return;
  const line=LYRICS[idx];
  const lineAlpha=smooth(line.times[0]-.06,line.times[0]+.04,t)*(1-smooth(line.end+.1,line.end+.24,t));
  if(lineAlpha<=0)return;
  const size=66,gap=7,spaceW=34;
  ctx.save();ctx.globalAlpha=lineAlpha;
  ctx.font=`800 ${size}px "Microsoft YaHei","PingFang SC",sans-serif`;ctx.textBaseline="middle";
  const chars=[...line.text];
  const widths=chars.map(ch=>ch===" "?spaceW:ctx.measureText(ch).width);
  const total=widths.reduce((a,b)=>a+b,0)+gap*(chars.length-1);
  let x=W/2-total/2;
  const baseY=978;
  const band=ctx.createLinearGradient(0,baseY-80,0,baseY+72);
  band.addColorStop(0,"rgba(12,28,55,0)");band.addColorStop(.55,"rgba(12,28,55,.17)");band.addColorStop(1,"rgba(12,28,55,0)");
  ctx.fillStyle=band;ctx.fillRect(0,baseY-80,W,152);
  for(let i=0;i<chars.length;i++){
    const ch=chars[i],w=widths[i];
    if(ch!==" "){
      const at=line.times[i]??line.times[line.times.length-1];
      const q=clamp((t-at+.06)/.24);
      if(q>0){
        const pop=easeOutBack(q);
        const sc=.3+.7*pop;
        const yy=baseY+(1-q)*22+Math.sin(t*4+i*.9)*2.2;
        const al=smooth(0,.28,q);
        ctx.save();ctx.translate(x+w/2,yy);ctx.scale(sc,sc);ctx.globalAlpha*=al;
        ctx.lineJoin="round";ctx.textAlign="center";
        ctx.shadowColor="rgba(16,28,52,.55)";ctx.shadowBlur=16;ctx.shadowOffsetY=7;
        ctx.lineWidth=11;ctx.strokeStyle="rgba(24,38,65,.9)";ctx.strokeText(ch,0,0);
        ctx.shadowBlur=0;ctx.shadowOffsetY=0;
        ctx.lineWidth=4;ctx.strokeStyle="rgba(255,255,255,.38)";ctx.strokeText(ch,0,0);
        ctx.fillStyle="#fffdf7";ctx.fillText(ch,0,0);
        ctx.restore();
      }
    }
    x+=w+gap;
  }
  ctx.restore();
}
function drawTitle(t){

  if(t<3.2){a=1-smooth(2.5,3.2,t);pop=easeOutBack(clamp((t-.12)/.35))}
  if(t>32.72){a=smooth(32.72,33.1,t);pop=easeOutBack(clamp((t-32.72)/.35))}
  if(a<=.001)return;
  ctx.save();ctx.globalAlpha=a;
  ctx.translate(W/2,132);ctx.scale(pop,pop);ctx.rotate(-.025);
  ctx.font='900 76px "Microsoft YaHei","PingFang SC",sans-serif';ctx.textAlign="center";ctx.textBaseline="middle";
  const txt="开心往前飞";const tw=ctx.measureText(txt).width;
  rr(-tw/2-38,-58,tw+76,116,30);ctx.fillStyle="rgba(255,248,231,.9)";ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=rgba(C.ink,.85);ctx.stroke();
  ctx.shadowColor="rgba(20,35,60,.35)";ctx.shadowBlur=12;ctx.shadowOffsetY=5;ctx.fillStyle=C.coral;ctx.fillText(txt,0,3);ctx.shadowBlur=0;

  ctx.restore();

function drawGrain(){ctx.save();ctx.globalAlpha=.055;ctx.fillStyle=GRAIN;ctx.fillRect(0,0,W,H);ctx.restore()}
function drawVignette(){const g=ctx.createRadialGradient(W/2,H*.48,H*.28,W/2,H*.5,H*.88);g.addColorStop(0,"rgba(10,18,35,0)");g.addColorStop(.76,"rgba(10,18,35,.03)");g.addColorStop(1,"rgba(10,18,35,.3)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function renderFrame(T){
  const t=Math.min(Math.max(T,0),FREEZE);
  const b=beatAt(t);
  const zoom=1+.0045*(b.pulse)*(b.strong?1:.55)+.002*Math.sin(t*.9);
  const shake=b.strong?b.pulse*2.2:0;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#0b1830";ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2+Math.sin(t*41)*shake,H/2+Math.cos(t*37)*shake*.6);ctx.scale(zoom,zoom);ctx.translate(-W/2,-H/2);
  if(t<2.30)drawOcean(t);
  else if(t<2.62){
    drawOcean(t);const p=smooth(2.30,2.62,t);const wy=lerp(0,H,p);ctx.save();ctx.beginPath();ctx.rect(0,0,W,wy);ctx.clip();drawPanorama(t);ctx.restore();

  }
  else if(t<5.55)drawPanorama(t);

    ctx.save();ctx.beginPath();ctx.arc(960,560,r,0,TAU);ctx.clip();drawGlobeScene(t);ctx.restore();
    ctx.save();ctx.globalAlpha=(1-p)*.75;ctx.beginPath();ctx.arc(960,560,r+10,0,TAU);ctx.lineWidth=18;ctx.strokeStyle="#eaffff";ctx.stroke();ctx.restore();
  }

  else if(t<9.78){
    drawGlobeScene(t);const p=smooth(9.58,9.78,t);const s=1.12-.12*easeOut(p);
    ctx.save();ctx.globalAlpha=p;ctx.translate(W/2,H/2);ctx.scale(s,s);ctx.translate(-W/2,-H/2);drawHighScene(t);ctx.restore();
    ctx.save();ctx.globalAlpha=(1-p)*.42;ctx.fillStyle="#fff8e7";ctx.fillRect(0,0,W,H);ctx.restore();
  }
  else if(t<11.62)drawHighScene(t);
  else if(t<11.98){
    const p=smooth(11.62,11.98,t);const wx=W*(1-easeInOut(p));
    ctx.save();ctx.translate(-W*easeInOut(p),0);drawHighScene(t);ctx.restore();
    ctx.save();ctx.beginPath();ctx.rect(wx,0,W-wx+4,H);ctx.clip();ctx.translate(W-wx,0);drawTravelScene(t);ctx.restore();
    ctx.save();ctx.globalAlpha=(1-p)*.8;for(let i=0;i<24;i++){const y=40+i*48;ctx.beginPath();ctx.moveTo(wx-260,y);ctx.lineTo(wx+20,y-10);ctx.lineWidth=5;ctx.strokeStyle="rgba(255,255,255,.7)";ctx.stroke()}ctx.restore();
    const fl=Math.exp(-Math.pow((p-.5)*7,2));if(fl>.01){ctx.save();ctx.globalAlpha=fl*.5;ctx.fillStyle="#fff8e7";ctx.fillRect(0,0,W,H);ctx.restore()}
  }
  else if(t<18.55)drawTravelScene(t);
  else if(t<18.95){
    drawTravelScene(t);const p=smooth(18.55,18.95,t);ctx.save();ctx.globalAlpha=p;drawStormScene(t);ctx.restore();
    ctx.save();ctx.globalAlpha=1-p;drawCloud(-40,90,2.1,"#30355a",false,.8);drawCloud(700,130,1.8,"#30355a",false,.75);drawCloud(1540,80,2.2,"#30355a",false,.8);ctx.restore();
    const fl=Math.exp(-Math.pow((p-.5)*5.5,2));if(fl>.01){ctx.save();ctx.globalAlpha=fl*.92;ctx.fillStyle="#e8f4ff";ctx.fillRect(0,0,W,H);ctx.restore()}
  }
  else if(t<21.42)drawStormScene(t);
  else if(t<22.05){
    drawStormScene(t);const p=smooth(21.42,22.05,t);const r=easeInOut(p)*1180;
    ctx.save();ctx.beginPath();ctx.arc(1090,610,r,0,TAU);ctx.clip();drawAboveClouds(t);ctx.restore();
    ctx.save();ctx.globalAlpha=(1-p)*.85;ctx.beginPath();ctx.arc(1090,610,r+14,0,TAU);ctx.lineWidth=22;ctx.strokeStyle="#fff7cf";ctx.stroke();ctx.restore();
    ctx.save();ctx.globalAlpha=(1-p)*.32;ctx.fillStyle="#fff8e7";ctx.fillRect(0,0,W,H);ctx.restore();
  }
  else if(t<27.05)drawAboveClouds(t);
  else if(t<27.5){
    drawAboveClouds(t);const p=smooth(27.05,27.5,t);const wy=H*easeInOut(p);
    ctx.save();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);
    for(let x=W;x>=0;x-=40)ctx.lineTo(x,wy+Math.sin(x*.009+t*2.4)*38+Math.sin(x*.02-t)*13);
    ctx.lineTo(0,0);ctx.closePath();ctx.clip();drawSpaceScene(t);ctx.restore();
    ctx.save();ctx.globalAlpha=(1-p)*.7;const sg=ctx.createLinearGradient(0,wy-130,0,wy+100);sg.addColorStop(0,"rgba(160,235,255,0)");sg.addColorStop(.45,"rgba(225,252,255,.9)");sg.addColorStop(1,"rgba(160,235,255,0)");ctx.fillStyle=sg;ctx.beginPath();ctx.moveTo(0,wy-90);for(let x=0;x<=W;x+=40)ctx.lineTo(x,wy+Math.sin(x*.009+t*2.4)*38);ctx.lineTo(W,wy+100);ctx.lineTo(0,wy+100);ctx.closePath();ctx.fill();ctx.restore();
    ctx.save();ctx.globalAlpha=(1-p)*.55;for(let i=0;i<10;i++){const x=mod(i*230+t*60,W);drawCloud(x,wy+Math.sin(x*.009+t*2.4)*38+22,.8,"#fff0da",false,.55)}ctx.restore();
  }

  ctx.setTransform(1,0,0,1,0,0);

let playing=false,raf=0;
function drawAt(tt){renderFrame(tt)}
function loop(){
  if(!playing)return;
  let t=audio.currentTime;
  if(t>=DURATION-.005){t=DURATION;playing=false;drawAt(t);return}
  drawAt(t);raf=requestAnimationFrame(loop);
}
function start(){
  overlay.classList.add("hidden");
  audio.pause();audio.currentTime=0;
  const pr=audio.play();
  if(pr&&pr.catch)pr.catch(e=>{errBox.textContent="音频播放失败，请检查 song.wav 是否在同目录";errBox.style.opacity=1});
  playing=true;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
document.getElementById("start").addEventListener("click",start);
audio.addEventListener("ended",()=>{playing=false;drawAt(DURATION)});
window.seek=function(sec){overlay.classList.add("hidden");overlay.style.display="none";playing=false;cancelAnimationFrame(raf);try{audio.pause()}catch(e){}drawAt(clamp(Number(sec)||0,0,DURATION));};
window.MV={seek:window.seek,duration:DURATION,freeze:FREEZE};
drawAt(0);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawAt(0);window.__MV_READY=true});else window.__MV_READY=true;
})();
